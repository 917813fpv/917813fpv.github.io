<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>超级盘古计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f3f8ff;
            padding: 20px;
            text-align: center;
        }
        .box {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 20px #b8d8f8;
        }
        h1 {
            color: #ff4444;
            margin-bottom: 15px;
        }
        .tip {
            color: #555;
            margin-bottom: 20px;
        }
        .ctrl {
            margin-bottom: 30px;
        }
        .numBtn {
            padding: 6px 12px;
            margin: 3px;
            border: none;
            border-radius: 6px;
            background: #5099ff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .opBtn {
            padding: 8px 18px;
            margin: 0 6px;
            border: none;
            border-radius: 6px;
            background: #ff8800;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
        }
        .resetBtn {
            background: #dd2222;
        }
        .expText {
            font-size: 22px;
            margin: 15px 0;
            font-weight: bold;
            color: #222;
        }
        /* 手绘手掌 */
        .hand {
            display: inline-block;
            position: relative;
            width: 110px;
            height: 95px;
            margin: 10px;
        }
        .palm {
            width: 65px;
            height: 48px;
            border: 2px solid #222;
            background: #ffdfd0;
            border-radius: 10px;
            margin: 28px auto 0;
        }
        .finger {
            position: absolute;
            top: 0;
            width: 16px;
            height: 38px;
            border: 2px solid #222;
            border-radius: 6px;
            background: #ffdfd0;
        }
        .finger span {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
        }
        .finger.light {
            background: #ff5555;
            box-shadow: 0 0 8px #ff3333;
        }
        .f1{left:5px;}
        .f2{left:24px;}
        .f3{left:43px;}
        .f4{left:62px;}
        .f5{left:81px;}

        /* 手绘脚掌 */
        .foot {
            display: inline-block;
            position: relative;
            width: 130px;
            height: 105px;
            margin: 10px;
        }
        .footMain {
            width: 80px;
            height: 55px;
            border: 2px solid #222;
            background: #ffdfd0;
            border-radius: 50% 50% 30% 30%;
            margin: 35px auto 0;
        }
        .toe {
            position: absolute;
            top: 8px;
            width: 18px;
            height: 24px;
            border: 2px solid #222;
            border-radius: 50%;
            background: #ffdfd0;
        }
        .toe span {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
        }
        .toe.light {
            background: #ff5555;
            box-shadow: 0 0 8px #ff3333;
        }
        .t1{left:8px;}
        .t2{left:30px;}
        .t3{left:52px;}
        .t4{left:74px;}
        .t5{left:96px;}

        .countArea {
            min-height: 240px;
            margin: 30px 0;
        }
        /* 炸裂结果文字 */
        .resultText {
            font-size: 36px;
            font-weight: 900;
            color: #ff2222;
            text-shadow: 3px 3px 0 #ffcc00, 6px 6px 8px #999;
            margin-top: 25px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>超级盘古计算器</h1>
        <div class="tip">键盘按+ - 快速切换，一根一根慢速数数，全程语音慢播报</div>
        <div class="ctrl">
            <div>
                <button class="numBtn" onclick="clickNum(1)">1</button>
                <button class="numBtn" onclick="clickNum(2)">2</button>
                <button class="numBtn" onclick="clickNum(3)">3</button>
                <button class="numBtn" onclick="clickNum(4)">4</button>
                <button class="numBtn" onclick="clickNum(5)">5</button>
                <button class="numBtn" onclick="clickNum(6)">6</button>
                <button class="numBtn" onclick="clickNum(7)">7</button>
                <button class="numBtn" onclick="clickNum(8)">8</button>
                <button class="numBtn" onclick="clickNum(9)">9</button>
                <button class="numBtn" onclick="clickNum(10)">10</button>
                <button class="numBtn" onclick="clickNum(15)">15</button>
                <button class="numBtn" onclick="clickNum(20)">20</button>
                <button class="numBtn" onclick="clickNum(25)">25</button>
                <button class="numBtn" onclick="clickNum(30)">30</button>
            </div>
            <div style="margin:12px 0;">
                <button class="opBtn" onclick="clickOp('+')">加号</button>
                <button class="opBtn" onclick="clickOp('-')">减号</button>
                <button class="opBtn resetBtn" onclick="resetAll()">重置</button>
            </div>
            <div class="expText" id="expShow">请先选择数字与运算</div>
        </div>

        <div class="countArea" id="countArea"></div>
        <div class="resultText" id="resultText"></div>
    </div>

    <script>
        let n1 = 0, n2 = 0, op = "";
        let stepFlag = 1;
        const DELAY = 600; 

        document.addEventListener('keydown',e=>{
            if(e.key === '+') clickOp('+');
            if(e.key === '-') clickOp('-');
        });

        // 慢速语音
        function speak(txt){
            if(!window.speechSynthesis)return;
            speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(txt);
            u.lang = "zh-CN";
            u.rate = 0.85;
            u.volume = 1;
            speechSynthesis.speak(u);
        }

        function clickNum(num){
            speak(num + "");
            if(stepFlag === 1){
                n1 = num;
                stepFlag = 2;
            }else{
                n2 = num;
                stepFlag = 1;
                startSlowCalc();
            }
            updateExp();
        }
        function clickOp(o){
            op = o;
            speak(o === "+" ? "加" : "减");
            updateExp();
        }
        function updateExp(){
            document.getElementById("expShow").innerText = `${n1} ${op} ${n2}`;
        }
        function resetAll(){
            n1=0;n2=0;op="";stepFlag=1;
            document.getElementById("countArea").innerHTML = "";
            document.getElementById("resultText").style.display = "none";
            document.getElementById("expShow").innerText = "请先选择数字与运算";
            speak("已重置");
        }

        async function startSlowCalc(){
            let total = op==="+" ? n1+n2 : n1-n2;
            if(total < 0){
                speak("计算错误，结果不能为负数");
                countArea.innerHTML = "<p style='color:red;font-size:20px'>结果不能为负数</p>";
                return;
            }
            document.getElementById("countArea").innerHTML = "";
            document.getElementById("resultText").style.display = "none";
            let rest = total;
            let now = 0;

            while(rest > 0){
                if(rest > 0){
                    let need = Math.min(5, rest);
                    await createHandSlow(need, now);
                    now += need;
                    rest -= need;
                }
                if(rest > 0){
                    let need = Math.min(5, rest);
                    await createFootSlow(need, now);
                    now += need;
                    rest -= need;
                }
            }

            setTimeout(()=>{
                speak("超级计算器已计算出结果等于" + total);
                let resDom = document.getElementById("resultText");
                resDom.innerText = `超级计算器最终结果：${total}`;
                resDom.style.display = "block";
            },DELAY * 2);
        }

        async function createHandSlow(count, start){
            return new Promise(async resolve=>{
                let handDiv = document.createElement("div");
                handDiv.className = "hand";
                let fingerHtml = "";
                for(let i=1;i<=5;i++){
                    fingerHtml += `
                        <div class="finger f${i}">
                            <span>${start + i}</span>
                        </div>
                    `;
                }
                handDiv.innerHTML = fingerHtml + `<div class="palm"></div>`;
                document.getElementById("countArea").appendChild(handDiv);

                let fingers = handDiv.querySelectorAll(".finger");
                for(let i=0;i<count;i++){
                    await delay(DELAY);
                    fingers[i].classList.add("light");
                    speak(start + i + 1 + "");
                }
                resolve();
            })
        }

        async function createFootSlow(count, start){
            return new Promise(async resolve=>{
                let footDiv = document.createElement("div");
                footDiv.className = "foot";
                let toeHtml = "";
                for(let i=1;i<=5;i++){
                    toeHtml += `
                        <div class="toe t${i}">
                            <span>${start + i}</span>
                        </div>
                    `;
                }
                footDiv.innerHTML = toeHtml + `<div class="footMain"></div>`;
                document.getElementById("countArea").appendChild(footDiv);

                let toes = footDiv.querySelectorAll(".toe");
                for(let i=0;i<count;i++){
                    await delay(DELAY);
                    toes[i].classList.add("light");
                    speak(start + i + 1 + "");
                }
                resolve();
            })
        }
        function delay(t){
            return new Promise(res=>setTimeout(res,t));
        }
    </script>
</body>
</html>
