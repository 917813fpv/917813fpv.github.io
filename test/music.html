        const inputArea = document.getElementById('inputArea');
        const generateBtn = document.getElementById('generateBtn');

        const BASE_URL = 'http://music.163.com/song/media/outer/url?id=';

        const audioPlayer = document.getElementById('audioPlayer');

        const modeBtn = document.getElementById('modeBtn');
        const likeBtn = document.getElementById('likeBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        const importBtn = document.getElementById('importBtn');
        const rescanBtn = document.getElementById('rescanBtn');
        const importFile = document.getElementById('importFile');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const songIdDisplay = document.getElementById('songIdDisplay');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const foundCountEl = document.getElementById('foundCount');
        const statusIndicator = document.getElementById('statusIndicator');
        const scanningIndicator = document.getElementById('scanningIndicator');
        const currentScanningId = document.getElementById('currentScanningId');

        let songList = [];
        let currentIndex = 0;
        let isScanning = false;
        let scanningInterval = null;
        let infoScanInterval = null;
        let likedSongs = JSON.parse(localStorage.getItem('likedSongs') || '[]');
        const TARGET_QUEUE_SIZE = 1;
        const MAX_SONGS = 1000;
        const CHECK_TIMEOUT = 2000;
        let invalidIdCache = new Set();
        let playMode = 'random';
        let hasStartedPlaying = false;

        function randomSongId() {
            return Math.floor(Math.random() * (9999999 - 10000 + 1)) + 10000;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function checkSong(id) {
            if (invalidIdCache.has(id)) {
                return false;
            }
            
            return new Promise((resolve) => {
                const audio = new Audio();
                audio.muted = true;
                audio.preload = 'none';
                
                let resolved = false;
                
                const cleanup = () => {
                    if (!resolved) {
                        resolved = true;
                        audio.pause();
                        audio.removeAttribute('src');
                        audio.load();
                    }
                };
                
                const timeout = setTimeout(() => {
                    cleanup();
                    invalidIdCache.add(id);
                    resolve(false);
                }, CHECK_TIMEOUT);
                
                audio.onloadeddata = () => {
                    clearTimeout(timeout);
                    cleanup();
                    resolve(true);
                };
                
                audio.onloadedmetadata = () => {
                    clearTimeout(timeout);
                    cleanup();
                    resolve(true);
                };
                
                audio.oncanplay = () => {
                    clearTimeout(timeout);
                    cleanup();
                    resolve(true);
                };
                
                audio.onerror = () => {
                    clearTimeout(timeout);
                    cleanup();
                    invalidIdCache.add(id);
                    resolve(false);
                };
                
                audio.onabort = () => {
                    clearTimeout(timeout);
                    cleanup();
                    invalidIdCache.add(id);
                    resolve(false);
                };
                
                audio.src = `${BASE_URL}${id}.mp3`;
                audio.load();
            });
        }

        async function scanSongs() {
            if (isScanning) return;
            isScanning = true;
            
            statusIndicator.classList.add('hidden');
            scanningIndicator.classList.remove('hidden');
            
            while (songList.length < MAX_SONGS) {
                if (!isScanning) break;
                
                let id = randomSongId();
                while (invalidIdCache.has(id)) {
                    id = randomSongId();
                }
                
                currentScanningId.textContent = `ID: ${id}`;
                
                const isValid = await checkSong(id);
                
                if (isValid && songList.length < MAX_SONGS) {
                    songList.push({
                        id: id,
                        name: `歌曲 ${id}`,
                        artist: '未知艺术家',
                        cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'
                    });
                    foundCountEl.textContent = songList.length;
                    
                    if (!hasStartedPlaying && songList.length >= TARGET_QUEUE_SIZE) {
                        hasStartedPlaying = true;
                        currentIndex = 0;
                        playSong(currentIndex);
                        showToast(`开始播放！已扫描到 ${songList.length} 首歌曲`);
                    }
                }

                if (songList.length >= MAX_SONGS) {
                    break;
                }
            }

            clearInterval(scanningInterval);
            isScanning = false;
            
            scanningIndicator.classList.add('hidden');
            statusIndicator.classList.remove('hidden');
            currentScanningId.textContent = '';
            
            showToast(`扫描完成！共 ${songList.length} 首歌曲`);
        }

        function playRandomSong() {
            if (songList.length === 0) return;
            currentIndex = 0;
            playSong(currentIndex);
        }

        function playSong(index) {
            if (index < 0 || index >= songList.length) return;
            
            const song = songList[index];
            
            songTitle.textContent = song.name;
            songArtist.textContent = song.artist;
            songIdDisplay.textContent = song.id;
            
            audioPlayer.src = `${BASE_URL}${song.id}.mp3`;
            
            updateLikeButton();
            
            if (infoScanInterval) {
                clearInterval(infoScanInterval);
                infoScanInterval = null;
            }
            
            infoScanInterval = setInterval(() => {
                scanSongInfo(song.id);
            }, 1000);
            
            try {
                audioPlayer.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } catch (e) {
                console.log('播放失败', e);
            }
        }

        async function scanSongInfo(id) {
            if (!infoScanInterval) return;
            
            try {
                const audio = new Audio();
                audio.src = `${BASE_URL}${id}.mp3`;
                
                await new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        resolve();
                    }, 3000);
                    
                    audio.addEventListener('loadedmetadata', () => {
                        clearTimeout(timeout);
                        if (audio.duration && audio.duration > 0) {
                            const song = songList[currentIndex];
                            if (song && song.id === id) {
                                songTitle.textContent = `歌曲 ${id}`;
                                songArtist.textContent = `时长: ${formatTime(audio.duration)}`;
                                song.name = `歌曲 ${id}`;
                                song.artist = `时长: ${formatTime(audio.duration)}`;
                                
                                if (infoScanInterval) {
                                    clearInterval(infoScanInterval);
                                    infoScanInterval = null;
                                }
                            }
                        }
                        resolve();
                    });
                    
                    audio.addEventListener('error', () => {
                        clearTimeout(timeout);
                        resolve();
                    });
                    
                    audio.load();
                });
            } catch (e) {
                console.log('扫描歌曲信息失败', e);
            }
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                totalTimeEl.textContent = formatTime(audioPlayer.duration);
                
                const song = songList[currentIndex];
                if (song && song.artist === '未知艺术家') {
                    songTitle.textContent = `歌曲 ${song.id}`;
                    songArtist.textContent = `时长: ${formatTime(audioPlayer.duration)}`;
                    song.name = `歌曲 ${song.id}`;
                    song.artist = `时长: ${formatTime(audioPlayer.duration)}`;
                }
            }
        });

        audioPlayer.addEventListener('ended', () => {
            if (infoScanInterval) {
                clearInterval(infoScanInterval);
                infoScanInterval = null;
            }
            
            if (playMode === 'loop') {
                playSong(currentIndex);
            } else if (playMode === 'random') {
                currentIndex = Math.floor(Math.random() * songList.length);
                playSong(currentIndex);
            } else {
                currentIndex++;
                
                if (currentIndex >= songList.length) {
                    songList = [];
                    foundCountEl.textContent = 0;
                    scanSongs();
                } else {
                    playSong(currentIndex);
                }
            }
        });

        playBtn.addEventListener('click', () => {
            if (songList.length === 0) {
                scanSongs();
                return;
            }
            
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audioPlayer.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (songList.length === 0) return;
            if (playMode === 'random') {
                currentIndex = Math.floor(Math.random() * songList.length);
                playSong(currentIndex);
            } else if (currentIndex > 0) {
                currentIndex--;
                playSong(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (songList.length === 0) return;
            if (playMode === 'random') {
                currentIndex = Math.floor(Math.random() * songList.length);
                playSong(currentIndex);
            } else if (currentIndex < songList.length - 1) {
                currentIndex++;
                playSong(currentIndex);
            }
        });

        likeBtn.addEventListener('click', () => {
            if (songList.length === 0) return;
            const song = songList[currentIndex];
            if (likedSongs.includes(song.id)) {
                likedSongs = likedSongs.filter(id => id !== song.id);
                likeBtn.innerHTML = '<i class="fas fa-heart"></i>';
                showToast('已取消喜欢');
            } else {
                likedSongs.push(song.id);
                likeBtn.innerHTML = '<i class="fas fa-heart" style="color: #ef4444;"></i>';
                showToast('已添加到我喜欢的歌');
            }
            localStorage.setItem('likedSongs', JSON.stringify(likedSongs));
            updateLikeButton();
        });

        downloadBtn.addEventListener('click', async () => {
            if (songList.length === 0) {
                showToast('当前没有正在播放的歌曲');
                return;
            }
            const song = songList[currentIndex];
            const downloadUrl = `https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
            
            try {
                showToast('正在下载，请稍候...');
                const response = await fetch(downloadUrl);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `歌曲${song.id}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('下载已开始');
            } catch (e) {
                console.log('下载失败', e);
                showToast('下载失败，请重试');
            }
        });

        shareBtn.addEventListener('click', () => {
            if (likedSongs.length === 0) {
                showToast('我喜欢的歌单为空');
                return;
            }
            const content = likedSongs.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '我喜欢的歌.txt';
            a.click();
            URL.revokeObjectURL(url);
            showToast('已导出我喜欢的歌');
        });

        importBtn.addEventListener('click', () => {
            importFile.click();
        });

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                const ids = content.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && /^\d+$/.test(line));
                
                if (ids.length > 0) {
                    likedSongs = [...new Set([...likedSongs, ...ids])];
                    localStorage.setItem('likedSongs', JSON.stringify(likedSongs));
                    showToast(`成功导入 ${ids.length} 首歌曲`);
                    updateLikeButton();
                } else {
                    showToast('未找到有效的歌曲ID');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        rescanBtn.addEventListener('click', () => {
            isScanning = false;
            if (scanningInterval) {
                clearInterval(scanningInterval);
            }
            if (infoScanInterval) {
                clearInterval(infoScanInterval);
            }
            songList = [];
            foundCountEl.textContent = 0;
            scanSongs();
        });

        function updateLikeButton() {
            if (songList.length > 0) {
                const song = songList[currentIndex];
                if (likedSongs.includes(song.id)) {
                    likeBtn.innerHTML = '<i class="fas fa-heart" style="color: #ef4444;"></i>';
                } else {
                    likeBtn.innerHTML = '<i class="fas fa-heart"></i>';
                }
            }
        }

        modeBtn.addEventListener('click', () => {
            if (playMode === 'random') {
                playMode = 'loop';
                modeBtn.innerHTML = '<i class="fas fa-redo"></i>';
                modeBtn.title = '单曲循环';
                showToast('切换到单曲循环模式');
            } else if (playMode === 'loop') {
                playMode = 'sequential';
                modeBtn.innerHTML = '<i class="fas fa-list"></i>';
                modeBtn.title = '顺序播放';
                showToast('切换到顺序播放模式');
            } else {
                playMode = 'random';
                modeBtn.innerHTML = '<i class="fas fa-random"></i>';
                modeBtn.title = '随机播放';
                showToast('切换到随机播放模式');
            }
        });

        progressBar.addEventListener('click', (e) => {
            if (!audioPlayer.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        function extractSongId(input) {
            input = input.trim();
            if (!input) return null;
            const idMatch = input.match(/id=(\d+)/);
            if (idMatch && idMatch[1]) return idMatch[1];
            if (/^\d+$/.test(input)) return input;
            return null;
        }

        function generateUrl(id) {
            return `${BASE_URL}${id}.mp3`;
        }

        generateBtn.addEventListener('click', () => {
            const inputContent = inputArea.value.trim();
            if (!inputContent) {
                showToast('请先输入歌曲ID或链接！');
                return;
            }

            const lines = inputContent.split('\n').filter(line => line.trim());
            const resultData = [];

            lines.forEach((line, index) => {
                const id = extractSongId(line);
                resultData.push({
                    index: index + 1,
                    id: id,
                    origin: line,
                    url: id ? generateUrl(id) : null,
                    isValid: !!id
                });
            });

            renderResult(resultData);
            copyAllBtn.disabled = false;
            showToast(`成功生成 ${resultData.filter(item => item.isValid).length} 个有效外链！`);
        });

        function renderResult(data) {
            resultEmpty.classList.add('hidden');
            resultList.classList.remove('hidden');
            resultList.innerHTML = '';

            data.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';

                if (item.isValid) {
                    itemDiv.innerHTML = `
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="badge badge-success">序号 ${item.index}</span>
                                    <span class="text-gray-500 text-sm">歌曲ID: <span class="text-gray-800 font-medium">${item.id}</span></span>
                                </div>
                                <a href="${item.url}" target="_blank" class="text-brand-600 hover:text-brand-700 font-medium break-all">
                                    ${item.url}
                                </a>
                            </div>
                            <div class="flex gap-3 shrink-0">
                                <button class="copyBtn btn-secondary py-2 px-4 text-sm" data-url="${item.url}">
                                    <i class="fas fa-copy mr-1"></i>复制
                                </button>
                                <a href="${item.url}" target="_blank" class="btn-primary py-2 px-4 text-sm">
                                    <i class="fas fa-play mr-1"></i>试听
                                </a>
                            </div>
                        </div>
                    `;
                } else {
                    itemDiv.innerHTML = `
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="badge badge-error">序号 ${item.index}</span>
                                    <span class="text-red-500">无法识别的内容</span>
                                </div>
                                <p class="text-gray-400 break-all">${item.origin}</p>
                            </div>
                        </div>
                    `;
                }

                resultList.appendChild(itemDiv);
            });

            document.querySelectorAll('.copyBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    navigator.clipboard.writeText(url).then(() => {
                        showToast('链接复制成功！');
                    });
                });
            });
        }

        copyAllBtn.addEventListener('click', () => {
            const allLinks = [];
            document.querySelectorAll('.copyBtn').forEach(btn => {
                allLinks.push(btn.getAttribute('data-url'));
            });
            if (allLinks.length === 0) {
                showToast('暂无有效链接可复制！');
                return;
            }
            navigator.clipboard.writeText(allLinks.join('\n')).then(() => {
                showToast('全部链接复制成功！');
            });
        });

        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            resultList.innerHTML = '';
            resultList.classList.add('hidden');
            resultEmpty.classList.remove('hidden');
            copyAllBtn.disabled = true;
            showToast('已清空全部内容');
        });
    </script>
</body>
</html>
