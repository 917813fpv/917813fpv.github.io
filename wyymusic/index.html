        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {

                            900: '#0c4a6e',

                        accent: {

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 50%, #ffffff 100%);
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .gradient-text {
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6, #ec4899);
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.15), 0 12px 24px -8px rgba(139, 92, 246, 0.1);
            border-color: rgba(14, 165, 233, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: white;
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.35), 0 5px 15px rgba(139, 92, 246, 0.2);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #475569;
            padding: 12px 30px;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.4s ease;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-secondary:hover {
            border-color: #0ea5e9;
            color: #0ea5e9;
            background: rgba(14, 165, 233, 0.05);
            transform: translateY(-3px);
        }

        .input-area {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 16px;
            color: #1e293b;
            transition: all 0.3s ease;
            resize: none;
            width: 100%;
        }

        .input-area:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .input-area::placeholder {
            color: #94a3b8;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes scale-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-scale-pulse {
            animation: scale-pulse 4s ease-in-out infinite;
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 10s ease-in-out infinite;
        }

        .grid-pattern {
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(14, 165, 233, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .result-item {
            background: rgba(14, 165, 233, 0.03);
            border: 1px solid rgba(14, 165, 233, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            background: rgba(14, 165, 233, 0.06);
            border-color: rgba(14, 165, 233, 0.2);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .badge-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.1), rgba(139, 92, 246, 0.1));
            color: #0ea5e9;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body class="grid-pattern">
    <div class="hero-blob w-[400px] h-[400px] bg-brand-400/30 top-0 right-0"></div>
    <div class="hero-blob w-[300px] h-[300px] bg-accent-purple/30 bottom-0 left-0" style="animation-delay: -3s;"></div>

    <div class="min-h-screen py-10 px-4 relative">
        <header class="text-center mb-12 relative">
            <div class="inline-flex items-center gap-4 mb-5 animate-float">
                <div class="w-14 h-14 rounded-2xl gradient-bg flex items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/25 animate-scale-pulse">
                    <i class="fas fa-music"></i>
                </div>
                <h1 class="font-display text-3xl md:text-4xl font-bold">
                    <span class="gradient-text">音乐解析</span>
                </h1>
            </div>
            <p class="text-gray-500 text-lg">网易云音乐MP3外链生成工具</p>
        </header>

        <div class="max-w-3xl mx-auto">
            <div class="card p-6 md:p-8 mb-8">
                <textarea 
                    id="inputArea" 
                    rows="6" 
                    class="input-area"
                    placeholder="请输入歌曲ID或网易云歌曲链接，一行一个，支持批量处理&#10;&#10;示例：&#10;317151&#10;http://music.163.com/#/song?id=317151"
                ></textarea>
                
                <div class="flex flex-wrap gap-4 mt-6">
                    <button id="generateBtn" class="btn-primary">
                        <i class="fas fa-magic mr-2"></i>生成外链
                    </button>
                    <button id="copyAllBtn" class="btn-secondary" disabled>
                        <i class="fas fa-copy mr-2"></i>复制全部
                    </button>
                    <button id="clearBtn" class="btn-secondary ml-auto">
                        <i class="fas fa-trash mr-2"></i>清空
                    </button>
                </div>
            </div>

            <div id="resultEmpty" class="card p-12 text-center">
                <div class="icon-wrapper bg-gray-100 text-gray-400 mx-auto mb-4">
                    <i class="fas fa-music"></i>
                </div>
                <p class="text-gray-400">输入内容后点击生成，结果将显示在这里</p>
            </div>

            <div id="resultList" class="space-y-4 hidden"></div>

            <div class="card p-6 md:p-8 mt-8">
                <div class="flex items-center gap-3 mb-6">
                    <div class="icon-wrapper bg-gradient-to-br from-brand-400 to-brand-600 text-white">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <h2 class="font-display text-xl font-semibold">使用说明</h2>
                </div>
                <div class="space-y-4 text-gray-600">
                    <div class="flex items-start gap-3">
                        <i class="fas fa-check-circle text-brand-500 mt-1"></i>
                        <span>支持<strong class="text-gray-800">纯数字歌曲ID</strong>或<strong class="text-gray-800">完整歌曲链接</strong>，一行一个</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fas fa-check-circle text-brand-500 mt-1"></i>
                        <span>链接示例：<code class="bg-gray-100 px-2 py-1 rounded text-brand-600">http://music.163.com/#/song?id=317151</code></span>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fas fa-check-circle text-brand-500 mt-1"></i>
                        <span>生成格式：<code class="bg-gray-100 px-2 py-1 rounded text-brand-600">http://music.163.com/song/media/outer/url?id=歌曲ID.mp3</code></span>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fas fa-check-circle text-brand-500 mt-1"></i>
                        <span>生成的链接可直接用于下载、外链分享、网页音频播放</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script>
        const inputArea = document.getElementById('inputArea');
        const generateBtn = document.getElementById('generateBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultEmpty = document.getElementById('resultEmpty');
        const resultList = document.getElementById('resultList');
        const toast = document.getElementById('toast');

        const BASE_URL = 'http://music.163.com/song/media/outer/url?id=';
        
        function extractSongId(input) {
            input = input.trim();
            if (!input) return null;
            const idMatch = input.match(/id=(\d+)/);
            if (idMatch && idMatch[1]) return idMatch[1];
            if (/^\d+$/.test(input)) return input;
            return null;
        }

        function generateUrl(id) {
            return `${BASE_URL}${id}.mp3`;
        }

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        generateBtn.addEventListener('click', () => {
            const inputContent = inputArea.value.trim();
            if (!inputContent) {
                showToast('请先输入歌曲ID或链接！');
                return;
            }

            const lines = inputContent.split('\n').filter(line => line.trim());
            const resultData = [];

            lines.forEach((line, index) => {
                const id = extractSongId(line);
                resultData.push({
                    index: index + 1,
                    id: id,
                    origin: line,
                    url: id ? generateUrl(id) : null,
                    isValid: !!id
                });
            });

            renderResult(resultData);
            copyAllBtn.disabled = false;
            showToast(`成功生成 ${resultData.filter(item => item.isValid).length} 个有效外链！`);
        });

        function renderResult(data) {
            resultEmpty.classList.add('hidden');
            resultList.classList.remove('hidden');
            resultList.innerHTML = '';

            data.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';

                if (item.isValid) {
                    itemDiv.innerHTML = `
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="badge badge-success">序号 ${item.index}</span>
                                    <span class="text-gray-500 text-sm">歌曲ID: <span class="text-gray-800 font-medium">${item.id}</span></span>
                                </div>
                                <a href="${item.url}" target="_blank" class="text-brand-600 hover:text-brand-700 font-medium break-all">
                                    ${item.url}
                                </a>
                            </div>
                            <div class="flex gap-3 shrink-0">
                                <button class="copyBtn btn-secondary py-2 px-4 text-sm" data-url="${item.url}">
                                    <i class="fas fa-copy mr-1"></i>复制
                                </button>
                                <a href="${item.url}" target="_blank" class="btn-primary py-2 px-4 text-sm">
                                    <i class="fas fa-play mr-1"></i>试听
                                </a>
                            </div>
                        </div>
                    `;
                } else {
                    itemDiv.innerHTML = `
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="badge badge-error">序号 ${item.index}</span>
                                    <span class="text-red-500">无法识别的内容</span>
                                </div>
                                <p class="text-gray-400 break-all">${item.origin}</p>
                            </div>
                        </div>
                    `;
                }

                resultList.appendChild(itemDiv);
            });

            document.querySelectorAll('.copyBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    navigator.clipboard.writeText(url).then(() => {
                        showToast('链接复制成功！');
                    });
                });
            });
        }

        copyAllBtn.addEventListener('click', () => {
            const allLinks = [];
            document.querySelectorAll('.copyBtn').forEach(btn => {
                allLinks.push(btn.getAttribute('data-url'));
            });
            if (allLinks.length === 0) {
                showToast('暂无有效链接可复制！');
                return;
            }
            navigator.clipboard.writeText(allLinks.join('\n')).then(() => {
                showToast('全部链接复制成功！');
            });
        });

        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            resultList.innerHTML = '';
            resultList.classList.add('hidden');
            resultEmpty.classList.remove('hidden');
            copyAllBtn.disabled = true;
            showToast('已清空全部内容');
        });
    </script>
</body>
</html>
