<body class="grid-pattern">

    <div class="min-h-screen py-10 px-4 relative">
        <header class="text-center mb-12 relative">
            <div class="inline-flex items-center gap-4 mb-5 animate-float">
                <div class="w-14 h-14 rounded-2xl gradient-bg flex items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/25 animate-scale-pulse">

                        <video id="camera-view" autoplay muted playsinline></video>
                        <div class="scan-overlay"></div>

                    </button>

                </div>

                <div class="comments-section">
                    <div class="comments-title"><i class="fas fa-comments mr-2 text-brand-500"></i>用户互动</div>
                    <div class="powr-comments" id="9fbdf0c9_1760278017"></div>
                    <script src="https://www.powr.io/powr.js?platform=html"></script>
                </div>

                    <div class="ad-title">欢迎在评论区留下评论</div>

    <div class="ad-modal" id="ad-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div class="modal-title">广告位合作详情</div>
            
            <div class="my-6">
                <div class="text-gray-500 text-sm mb-2">联系方式·微信公众号私信</div>
                <div class="contact-value">公众号:917813.com.cn</div>
            </div>
            
            <div class="text-left max-w-xs mx-auto">
                <div class="price-item">短期合作：1元 / 7天</div>
                <div class="price-item">长期合作：3元 / 月</div>
            </div>
            
            <div class="confession-note">
                <i class="fas fa-heart mr-2"></i>支持定制内容：表白留言、生日祝福、友情寄语等
            </div>
        </div>
    </div>

    <script>
        const analyzeBtn = document.getElementById('analyze-btn');
        const cameraContainer = document.getElementById('camera-container');
        const cameraView = document.getElementById('camera-view');
        const countdown = document.getElementById('countdown');
        const resultContainer = document.getElementById('result-container');
        const progressFill = document.getElementById('progress-fill');
        const lengthDisplay = document.getElementById('length-display');
        const commentText = document.getElementById('comment-text');
        const resultUsernameText = document.getElementById('result-username-text');
        const usernameInput = document.getElementById('username');
        const copyBtn = document.getElementById('copy-btn');
        const copyTip = document.getElementById('copy-tip');
        const adSpaces = document.querySelectorAll('.ad-space');
        const adModal = document.getElementById('ad-modal');
        const closeModal = document.getElementById('close-modal');

        const comments = [
            "哇，这个长度真是让人羡慕！",
            "不错不错，继续保持！",
            "这个长度，可以说是相当可以了！",
            "厉害了我的哥，这长度没谁了！",
            "传说中的长度，你值得拥有！",
            "这个长度，可以说是业界标杆了！",
            "太强了，这个长度让人佩服！",
            "长度感人，值得纪念！",
            "这个长度，可以说是相当优秀了！",
            "厉害厉害，这个长度真是没话说！"
        ];

        adSpaces.forEach(space => {
            space.addEventListener('click', () => {
                adModal.classList.add('active');
            });
        });

        closeModal.addEventListener('click', () => {
            adModal.classList.remove('active');
        });

        adModal.addEventListener('click', (e) => {
            if (e.target === adModal) {
                adModal.classList.remove('active');
            }
        });

        analyzeBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim() || '匿名用户';
            
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>扫描中...';
            
            cameraContainer.style.display = 'block';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraView.srcObject = stream;
            } catch (err) {
                console.log('Camera not available, using simulation mode');
            }

            let count = 3;
            const countInterval = setInterval(() => {
                countdown.textContent = count;
                countdown.classList.add('active');
                countdown.style.opacity = '1';
                
                setTimeout(() => {
                    countdown.style.opacity = '0';
                    countdown.classList.remove('active');
                }, 800);
                
                count--;
                if (count < 0) {
                    clearInterval(countInterval);
                    setTimeout(() => {
                        cameraContainer.style.display = 'none';
                        showResult(username);
                        analyzeBtn.disabled = false;
                        analyzeBtn.innerHTML = '<i class="fas fa-search mr-2"></i>开始扫描分析';
                        
                        if (cameraView.srcObject) {
                            cameraView.srcObject.getTracks().forEach(track => track.stop());
                        }
                    }, 500);
                }
            }, 1000);
        });

        function showResult(username) {
            resultContainer.style.display = 'block';
            resultUsernameText.textContent = username;
            
            const length = Math.floor(Math.random() * 50) + 10;
            
            progressFill.style.width = '100%';
            
            let currentLength = 0;
            const lengthInterval = setInterval(() => {
                if (currentLength >= length) {
                    clearInterval(lengthInterval);
                } else {
                    currentLength++;
                    lengthDisplay.textContent = currentLength + 'cm';
                }
            }, 50);
            
            commentText.textContent = comments[Math.floor(Math.random() * comments.length)];
        }

        copyBtn.addEventListener('click', () => {
            const text = `我的长度是 ${lengthDisplay.textContent}！快来测测你的吧！`;
            navigator.clipboard.writeText(text).then(() => {
                copyTip.classList.add('active');
                setTimeout(() => copyTip.classList.remove('active'), 2000);
            });
        });
    </script>
</body>
