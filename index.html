<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src * 'unsafe-inline' 'unsafe-eval';
    frame-src https://cdn.917813.com.cn https://917813fpv-github-io.pages.dev https://917813.github.io;
    img-src * data:;
    script-src * 'unsafe-inline' 'unsafe-eval';
    style-src * 'unsafe-inline';
    connect-src *;
    object-src 'none';
  ">
  <title>赛事｜2026线上FPV竞速赛-Flyz远征飞魄客杯</title>
  <style>
    :root {
      --primary: #00ffff;
      --secondary: #87CEFA;
      --bg-deep: #000000;
      --bg-dark: #050505;
      --glow-primary: 0 0 15px var(--primary), 0 0 30px rgba(0, 255, 255, 0.5);
      --trans-fast: 0.3s ease-out;
      --trans-smooth: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      --dock-h: 58px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Consolas;
      background: var(--bg-deep);
      color: #fff;
      min-height: 100vh;
    }
    /* 开屏动画-极简提速 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      transition: opacity 0.8s ease, pointer-events 0s linear 0.8s;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      border: 2px solid var(--primary);
      box-shadow: var(--glow-primary);
      margin-bottom: 32px;
      overflow: hidden;
    }
    .splash-logo img { width: 100%; height: 100%; object-fit: cover; }
    .splash-main-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: var(--glow-primary);
      letter-spacing: 2px;
    }
    /* 页面容器-秒显 */
    #pages {
      position: relative;
      z-index: 10;
      min-height: calc(100vh - var(--dock-h));
      display: none;
    }
    .page-container {
      display: none;
      width: 100%;
      min-height: 100%;
      position: relative;
    }
    .page-container.active { display: block; }
    /* iframe加载中-秒显，覆盖整个容器 */
    .iframe-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0,255,255,0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      font-size: 1.1rem;
      color: var(--secondary);
      letter-spacing: 1px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* iframe-加载完成后覆盖loading */
    iframe {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: calc(100vh - var(--dock-h));
      border: none;
      background: var(--bg-dark);
      display: block;
    }
    /* 底部导航-极简 */
    #dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--dock-h);
      z-index: 20;
      background: rgba(255,255,255,0.08);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,255,255,0.3);
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }
    .dock-item {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all var(--trans-fast);
    }
    .dock-item:hover { color: var(--secondary); }
    .dock-item.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }
    /* HTTPS警告-极简 */
    #https-alert {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    #https-alert.active { display: flex; }
    #https-alert .title {
      font-size: 1.8rem;
      color: #ff3d00;
      margin-bottom: 16px;
    }
    #https-alert .desc {
      font-size: 1rem;
      color: #eee;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    #https-alert .btn {
      padding: 10px 30px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- HTTPS极简校验-仅全局阻断，无其他校验 -->
  <div id="https-alert">
    <div class="title">安全警告</div>
    <div class="desc">本页面仅支持HTTPS加密访问<br>请通过官方HTTPS链接重新访问</div>
    <button class="btn" onclick="window.location.href='https://cdn.917813.com.cn'">立即跳转</button>
  </div>

  <!-- 开屏动画-极简提速 -->
  <div id="splash-screen">
    <div class="splash-logo">
      <img src="logo.JPG" alt="Flyz远征飞" />
    </div>
    <div class="splash-main-title">2026线上FPV竞速赛</div>
  </div>

  <!-- 页面容器-秒进加载中 -->
  <div id="pages">
    <!-- 报名页-带秒显加载中 -->
    <div class="page-container active" data-target="home">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">报名页面加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/bm/index.html" title="报名入口" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 公告页-带秒显加载中 -->
    <div class="page-container" data-target="gg">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赛事公告加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/gg/index.html" title="赛事公告" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 选手页-带秒显加载中 -->
    <div class="page-container" data-target="xs">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">参赛选手加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/xs/index.html" title="参赛选手" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 奖品页-带秒显加载中 -->
    <div class="page-container" data-target="cs">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">奖品信息加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/cs/index.html" title="奖品信息" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 赞助页-带秒显加载中 -->
    <div class="page-container" data-target="zz">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赞助合作加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/zz/index.html" title="赞助合作" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 后勤页-带秒显加载中 -->
    <div class="page-container" data-target="hq">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赛事后勤加载中...</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/hq/index.html" title="赛事后勤" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
  </div>

  <!-- 底部导航-极简切页 -->
  <div id="dock">
    <div class="dock-item active" data-target="home">【报名】</div>
    <div class="dock-item" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">奖品</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    // 全局极简配置
    const config = {
      trustedDomain: 'cdn.917813.com.cn',
      targets: ['home', 'gg', 'xs', 'cs', 'zz', 'hq']
    };
    // DOM元素
    const el = {
      splash: document.getElementById('splash-screen'),
      pages: document.getElementById('pages'),
      httpsAlert: document.getElementById('https-alert'),
      dockItems: document.querySelectorAll('.dock-item'),
      pageContainers: document.querySelectorAll('.page-container')
    };

    // 1. 极简HTTPS校验-仅本地跳过，无其他校验
    const checkHttps = () => {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isLocal && window.location.protocol !== 'https:') {
        el.httpsAlert.classList.add('active');
        el.splash.style.display = 'none';
      } else {
        // 开屏动画播完直接显示页面-无阻塞
        setTimeout(() => {
          el.splash.style.opacity = 0;
          el.splash.style.pointerEvents = 'none';
          el.pages.style.display = 'block';
        }, 1200); // 开屏动画总时长1.2秒，秒进页面
      }
    };

    // 2. 极简切页-无校验，秒切
    const switchPage = (target) => {
      el.dockItems.forEach(item => item.classList.remove('active'));
      el.pageContainers.forEach(cont => cont.classList.remove('active'));
      document.querySelector(`.dock-item[data-target="${target}"]`).classList.add('active');
      document.querySelector(`.page-container[data-target="${target}"]`).classList.add('active');
    };

    // 绑定事件-极简
    document.addEventListener("DOMContentLoaded", () => {
      checkHttps();
      // 导航切页
      el.dockItems.forEach(item => {
        item.addEventListener('click', () => switchPage(item.dataset.target));
      });
    });
  </script>
</body>
</html>
