<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="index,follow" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src * 'unsafe-inline' 'unsafe-eval';
    frame-src https://cdn.917813.com.cn https://917813fpv-github-io.pages.dev https://917813.github.io;
    img-src * data:;
    script-src * 'unsafe-inline' 'unsafe-eval';
    style-src * 'unsafe-inline';
    connect-src *;
    object-src 'none';
  ">
  <title>赛事｜2026线上FPV竞速赛-Flyz远征飞魄客杯</title>
  <style>
    :root {
      --primary: #00ffff;
      --secondary: #87CEFA;
      --danger: #ff3d00;
      --bg-deep: #000000;
      --bg-dark: #050505;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(0, 255, 255, 0.3);
      --glow-primary: 0 0 15px var(--primary), 0 0 30px rgba(0, 255, 255, 0.5);
      --glow-warning: 0 0 15px var(--secondary), 0 0 30px rgba(135, 206, 250, 0.5);
      --trans-fast: 0.3s ease-out;
      --trans-smooth: 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      --trans-fade: 1s ease-in-out;
      --dock-h: 58px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Consolas", monospace;
      background: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 50%, rgba(10, 30, 40, 0.25), transparent 70%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 开屏动画-3秒完整版 陆续滑入+晃动+发光渐变 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      transition: opacity var(--trans-fade), pointer-events 0s linear var(--trans-fade);
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      border: 2px solid var(--primary);
      box-shadow: var(--glow-primary);
      margin-bottom: 48px;
      transform: translateX(-800px) rotate(-15deg);
      opacity: 0;
      animation: logoSlideIn 1s var(--trans-smooth) forwards 0.2s, logoShake 0.8s ease-in-out forwards 1.2s, glowPulse 3s ease-in-out infinite 1.5s;
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      filter: brightness(1.05);
    }
    .splash-main-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 24px;
      color: var(--primary);
      text-shadow: var(--glow-primary);
      letter-spacing: 2px;
      transform: translateX(800px);
      opacity: 0;
      animation: textSlideIn 1s var(--trans-smooth) forwards 0.6s, glowPulse 3s ease-in-out infinite 2s;
    }
    .splash-url {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--secondary);
      text-shadow: var(--glow-warning);
      letter-spacing: 2px;
      font-family: Consolas, monospace;
      transform: translateY(500px);
      opacity: 0;
      animation: urlSlideIn 1s var(--trans-smooth) forwards 1s, glowPulse 3s ease-in-out infinite 2.5s;
      padding: 6px 18px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(135,206,250,0.2);
    }
    /* 开屏动画关键帧 - 左滑入+晃动+发光脉冲 */
    @keyframes logoSlideIn {
      0% { transform: translateX(-800px) rotate(-15deg); opacity: 0; }
      100% { transform: translateX(0) rotate(0); opacity: 1; }
    }
    @keyframes logoShake {
      0% { transform: rotate(0); }
      25% { transform: rotate(3deg); }
      50% { transform: rotate(-3deg); }
      75% { transform: rotate(2deg); }
      100% { transform: rotate(0); }
    }
    @keyframes textSlideIn {
      0% { transform: translateX(800px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes urlSlideIn {
      0% { transform: translateY(500px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: var(--glow-primary); opacity: 0.9; }
      50% { box-shadow: 0 0 20px var(--primary), 0 0 40px rgba(0,255,255,0.7), 0 0 60px rgba(0,255,255,0.5); opacity: 1; }
    }

    /* 页面容器 + iframe秒显加载中 */
    #pages {
      position: relative;
      z-index: 10;
      background: var(--bg-dark);
      min-height: calc(100vh - var(--dock-h));
      display: none;
    }
    .page-container {
      display: none;
      width: 100%;
      min-height: 100%;
      position: relative;
    }
    .page-container.active { display: block; }
    /* iframe加载中-秒显 科技感加载动画 */
    .iframe-loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }
    .loading-spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(0,255,255,0.2);
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
    .loading-text {
      font-size: 1.2rem;
      color: var(--secondary);
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(135,206,250,0.3);
    }
    .loading-text::after {
      content: '';
      animation: dotPulse 1.5s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes dotPulse {
      0% { content: '.'; }
      33% { content: '..'; }
      66% { content: '...'; }
      100% { content: '.'; }
    }
    /* iframe-加载完成隐藏加载中 */
    iframe {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: calc(100vh - var(--dock-h));
      border: none;
      background: var(--bg-dark);
      display: block;
      pointer-events: auto;
      touch-action: auto;
    }

    /* 底部导航-保留原科技风格 */
    #dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--dock-h);
      z-index: 20;
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--glass-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    .dock-item {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 4px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all var(--trans-fast);
      border-bottom: 3px solid transparent;
    }
    .dock-item:hover {
      color: var(--secondary);
      text-shadow: var(--glow-warning);
      background: rgba(135, 206, 250, 0.05);
    }
    .dock-item.active {
      color: var(--primary);
      text-shadow: var(--glow-primary);
      border-bottom: 3px solid var(--primary);
      background: rgba(0, 255, 255, 0.06);
    }

    /* HTTPS极简校验提示 */
    #https-alert {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    #https-alert.active { display: flex; }
    #https-alert .title {
      font-size: 1.8rem;
      color: var(--danger);
      margin-bottom: 16px;
      text-shadow: 0 0 10px rgba(255,61,0,0.3);
    }
    #https-alert .desc {
      font-size: 1rem;
      color: #eee;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    #https-alert .btn {
      padding: 12px 35px;
      border-radius: 10px;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    #https-alert .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,255,255,0.2);
    }
  </style>
</head>
<body>
  <!-- HTTPS极简校验 -->
  <div id="https-alert">
    <div class="title">安全警告 - 非加密传输</div>
    <div class="desc">本页面仅支持HTTPS加密访问<br>请通过官方HTTPS链接重新访问，避免数据泄露</div>
    <button class="btn" onclick="window.location.href='https://cdn.917813.com.cn'">立即跳转官方</button>
  </div>

  <!-- 开屏动画-3秒完整版 陆续滑入+晃动+发光 -->
  <div id="splash-screen">
    <div class="splash-logo">
      <img src="logo.JPG" alt="Flyz远征飞" />
    </div>
    <div class="splash-main-title">2026线上FPV竞速赛</div>
    <div class="splash-url">cdn.917813.com.cn</div>
  </div>

  <!-- 页面容器 - 秒显iframe加载中 -->
  <div id="pages">
    <!-- 报名页 -->
    <div class="page-container active" data-target="home">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">报名页面加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/bm/index.html" title="2026线上FPV竞速赛-报名入口" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 公告页 -->
    <div class="page-container" data-target="gg">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赛事公告加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/gg/index.html" title="2026线上FPV竞速赛-赛事公告" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 选手页 -->
    <div class="page-container" data-target="xs">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">参赛选手加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/xs/index.html" title="2026线上FPV竞速赛-参赛选手" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 奖品页 -->
    <div class="page-container" data-target="cs">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">奖品信息加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/cs/index.html" title="2026线上FPV竞速赛-奖品信息" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 赞助页 -->
    <div class="page-container" data-target="zz">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赞助合作加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/zz/index.html" title="2026线上FPV竞速赛-赞助合作" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
    <!-- 后勤页 -->
    <div class="page-container" data-target="hq">
      <div class="iframe-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">赛事后勤加载中</div>
      </div>
      <iframe src="https://cdn.917813.com.cn/fpv/2026onlinerace/hq/index.html" title="2026线上FPV竞速赛-赛事后勤" onload="this.previousElementSibling.style.display='none'"></iframe>
    </div>
  </div>

  <!-- 底部导航 -->
  <div id="dock">
    <div class="dock-item active" data-target="home">【报名】</div>
    <div class="dock-item" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">奖品</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    // 全局配置
    const config = {
      trustedDomain: 'cdn.917813.com.cn',
      targets: ['home', 'gg', 'xs', 'cs', 'zz', 'hq'],
      splashDuration: 3000 // 开屏动画固定3秒
    };
    // DOM元素
    const el = {
      splash: document.getElementById('splash-screen'),
      pages: document.getElementById('pages'),
      httpsAlert: document.getElementById('https-alert'),
      dockItems: document.querySelectorAll('.dock-item'),
      pageContainers: document.querySelectorAll('.page-container')
    };

    // HTTPS极简校验
    const checkHttps = () => {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isLocal && window.location.protocol !== 'https:') {
        el.httpsAlert.classList.add('active');
        el.splash.style.display = 'none';
      } else {
        // 3秒开屏动画结束后 秒显页面+加载中
        setTimeout(() => {
          el.splash.style.opacity = 0;
          el.splash.style.pointerEvents = 'none';
          el.pages.style.display = 'block';
        }, config.splashDuration);
      }
    };

    // 导航切页-秒切 无阻塞
    const switchPage = (target) => {
      el.dockItems.forEach(item => item.classList.remove('active'));
      el.pageContainers.forEach(cont => cont.classList.remove('active'));
      document.querySelector(`.dock-item[data-target="${target}"]`).classList.add('active');
      document.querySelector(`.page-container[data-target="${target}"]`).classList.add('active');
    };

    // 绑定事件
    document.addEventListener("DOMContentLoaded", () => {
      checkHttps();
      // 底部导航点击
      el.dockItems.forEach(item => {
        item.addEventListener('click', () => switchPage(item.dataset.target));
      });
    });
  </script>
</body>
</html>
