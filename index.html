<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="index,follow" />
  <title>赛事｜2026线上FPV竞速赛-Flyz远征飞魄客杯</title>
  <meta name="keywords" content="2026线上FPV竞速赛,2026线上穿越机竞速赛,Flyz远征飞,魄客杯,FPV,穿越机,FPV穿越机,穿越机竞速,FPV比赛,穿越机比赛,线上FPV赛,线上穿越机赛,FPV飞手,穿越机飞手,竞速飞手,航模飞手,无人机飞手,花飞手,FPV爱好者,穿越机爱好者,航模爱好者,无人机爱好者,沉浸式飞行,第一人称飞行,FPV Drone,Drone Racing,RC航模,遥控航模,航模竞赛,线上航模赛,FPV赛事报名,穿越机赛事报名,赛事入口,参赛通道,飞手报名,竞速赛报名" />
  <style>
    :root {
      --primary: #00ffff;
      --secondary: #87CEFA;
      --bg-deep: #000000;
      --bg-dark: #050505;
      --dock-h: 58px;
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glow-primary: 0 0 8px var(--primary), 0 0 16px rgba(0, 255, 255, 0.3);
      --glow-secondary: 0 0 8px var(--secondary), 0 0 16px rgba(135, 206, 250, 0.3);
      --glow-text: 0 0 2px #fff, 0 0 4px rgba(255, 255, 255, 0.7);
      --trans-fast: 0.2s ease-out;
      /* 核心修改1：动画时长从0.35s延长到0.8s，播放更慢更丝滑 */
      --trans-smooth: 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      --trans-fade: 0.6s ease-in-out;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Consolas", monospace;
      background: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 50%, rgba(10, 30, 40, 0.25), transparent 70%);
      color: #fff;
      min-height: 100vh;
    }
    /* 开屏动画 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      transition: opacity var(--trans-fade), pointer-events 0s linear var(--trans-fade);
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      border: 2px solid var(--primary);
      box-shadow: var(--glow-primary);
      margin-bottom: 48px;
      transform: translateY(-300px) scale(0.85);
      opacity: 0;
      /* 核心修改2：动画时长延长，保持3秒总时长 */
      animation: logoDownBounce var(--trans-smooth) forwards 0.1s;
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      filter: brightness(1.05);
    }
    .splash-main-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 24px;
      color: var(--primary);
      text-shadow: var(--glow-primary);
      letter-spacing: 2px;
      transform: translateY(150px);
      opacity: 0;
      /* 核心修改3：动画时长延长 */
      animation: textUpBounce var(--trans-smooth) forwards 0.5s;
    }
    .splash-url {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--secondary);
      text-shadow: var(--glow-secondary);
      letter-spacing: 2px;
      font-family: Consolas, monospace;
      transform: translateY(150px);
      opacity: 0;
      /* 核心修改4：动画时长延长 */
      animation: textUpBounce var(--trans-smooth) forwards 0.5s;
      padding: 6px 18px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(135,206,250,0.2);
    }
    @keyframes logoDownBounce {
      0% { transform: translateY(-300px) scale(0.85); opacity: 0; }
      75% { transform: translateY(10px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes textUpBounce {
      0% { transform: translateY(150px); opacity: 0; }
      75% { transform: translateY(-6px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    /* 页面容器 - 彻底放开滚动 */
    #pages {
      position: relative;
      z-index: 10;
      background: var(--bg-dark);
      min-height: calc(100vh - var(--dock-h));
      padding: 0;
      display: none;
    }
    #pages.active { display: block; }
    /* 页面项 - 取消绝对定位，改为块级 */
    .page-container {
      display: none;
      width: 100%;
      min-height: 100%;
    }
    .page-container.active { display: block; }
    /* iframe - 自适应高度，完全放开交互 */
    iframe {
      width: 100%;
      min-height: calc(100vh - var(--dock-h));
      border: none;
      background: var(--bg-dark);
      display: block;
      /* 彻底放开iframe交互限制 */
      pointer-events: auto;
      touch-action: auto;
    }
    /* 底部导航栏 - 无安全区 */
    #dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--dock-h);
      z-index: 20;
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--glass-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    .dock-item {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: var(--glow-text);
      cursor: pointer;
      transition: all var(--trans-fast);
      border-bottom: 3px solid transparent;
    }
    .dock-item:hover {
      color: var(--secondary);
      text-shadow: var(--glow-secondary), var(--glow-text);
      background: rgba(135, 206, 250, 0.05);
    }
    .dock-item.active {
      color: var(--primary);
      text-shadow: var(--glow-primary), var(--glow-text);
      border-bottom: 3px solid var(--primary);
      background: rgba(0, 255, 255, 0.06);
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo">
      <img src="./logo.JPG" alt="Flyz远征飞" />
    </div>
    <div class="splash-main-title">2026线上FPV竞速赛</div>
    <div class="splash-url">cdn.917813.com.cn</div>
  </div>

  <div id="pages">
    <div class="page-container active" data-target="home">
      <iframe src="/fpv/2026onlinerace/bm/index.html" title="2026线上FPV竞速赛-报名入口" scrolling="yes"></iframe>
    </div>
    <div class="page-container" data-target="gg">
      <iframe src="/fpv/2026onlinerace/gg/index.html" title="2026线上FPV竞速赛-赛事公告" scrolling="yes"></iframe>
    </div>
    <div class="page-container" data-target="xs">
      <iframe src="/fpv/2026onlinerace/xs/index.html" title="2026线上FPV竞速赛-参赛选手" scrolling="yes"></iframe>
    </div>
    <div class="page-container" data-target="cs">
      <iframe src="/fpv/2026onlinerace/cs/index.html" title="2026线上FPV竞速赛-奖品信息" scrolling="yes"></iframe>
    </div>
    <div class="page-container" data-target="zz">
      <iframe src="/fpv/2026onlinerace/zz/index.html" title="2026线上FPV竞速赛-赞助合作" scrolling="yes"></iframe>
    </div>
    <div class="page-container" data-target="hq">
      <iframe src="/fpv/2026onlinerace/hq/index.html" title="2026线上FPV竞速赛-赛事后勤" scrolling="yes"></iframe>
    </div>
  </div>

  <div id="dock">
    <div class="dock-item active" data-target="home">【报名】</div>
    <div class="dock-item" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">奖品</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById('splash-screen');
      const pages = document.getElementById('pages');
      const dockItems = document.querySelectorAll('.dock-item');
      const pageContainers = document.querySelectorAll('.page-container');
      let currentTarget = 'home';

      // 开屏动画结束后显示页面（保持3秒总时长）
      setTimeout(() => {
        splash.style.opacity = 0;
        splash.style.pointerEvents = 'none';
        pages.style.display = 'block';
      }, 3000);

      // 切页逻辑
      const switchPage = (target) => {
        if (target === currentTarget) return;
        dockItems.forEach(item => item.classList.remove('active'));
        pageContainers.forEach(cont => cont.classList.remove('active'));
        document.querySelector(`.dock-item[data-target="${target}"]`).classList.add('active');
        document.querySelector(`.page-container[data-target="${target}"]`).classList.add('active');
        currentTarget = target;
      };

      dockItems.forEach(item => item.addEventListener('click', () => switchPage(item.dataset.target)));
    });
  </script>
</body>
</html>
