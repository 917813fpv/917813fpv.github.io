<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https://img520.com https://i.ooxx.ooo data:; frame-src 'self' https://917813.com.cn; font-src https://cdn.jsdelivr.net;">

  <title>赛事中心｜2026线上FPV竞速赛</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/4.1.13/lib.min.js"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #00ffff;
      --secondary: #66ccff;
      --dark: #050b14;
      --overlay: rgba(0, 15, 30, 0.85);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --green: #00ff66;
      --red: #ff4d4d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Consolas", "Monaco", monospace;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(0, 100, 150, 0.2), var(--dark) 70%),
                  linear-gradient(180deg, rgba(0,0,0,0.95), var(--dark));
      color: #fff;
    }

    #safety-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: var(--overlay);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #safety-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .safety-logo {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
      margin-bottom: 22px;
    }

    .safety-title {
      font-size: 2.2rem;
      color: var(--primary);
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      margin-bottom: 20px;
    }

    .safety-card {
      width: 90%;
      max-width: 420px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 24px;
    }

    .check-item {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .check-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      background: rgba(0, 255, 255, 0.1);
      margin-right: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0.8);
      animation: popIn 0.3s ease-out forwards;
    }

    .check-item:nth-child(1) .check-icon { animation-delay: 0.5s; }
    .check-item:nth-child(2) .check-icon { animation-delay: 0.8s; }
    .check-item:nth-child(3) .check-icon { animation-delay: 1.1s; }
    .check-item:nth-child(4) .check-icon { animation-delay: 1.4s; }

    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
    }

    .check-icon.success {
      border-color: var(--green);
      background: rgba(0, 255, 102, 0.15);
      color: var(--green);
    }

    .safety-status {
      margin-top: 22px;
      font-size: 1.2rem;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 1.8s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    #verify-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 40;
      display: none;
      justify-content: center;
      align-items: center;
    }

    #verify-modal.active {
      display: flex;
    }

    .modal-card {
      width: 90%;
      max-width: 380px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .modal-title {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 18px;
    }

    .verify-tip {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
    }

    .verify-area {
      width: 100%;
      height: 180px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      position: relative;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .verify-dot {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid var(--primary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    .verify-dot:hover {
      background: rgba(0, 255, 255, 0.35);
      transform: scale(1.1);
    }

    .verify-dot.correct {
      background: rgba(0, 255, 0, 0.3);
      border-color: #00ff00;
      color: #00ff00;
    }

    .error-msg {
      color: #ff6666;
      font-size: 1rem;
      margin-top: 12px;
      display: none;
    }

    .error-msg.active {
      display: block;
    }

    #pages {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
    }

    #pages.active {
      display: block;
    }

    .iframe-wrap {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .iframe-loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .iframe-loader-logo {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      margin-bottom: 12px;
    }

    .iframe-loader-title {
      font-size: 1.5rem;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .iframe-loader-text {
      font-size: 1rem;
      color: var(--secondary);
    }

    #dock {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 52px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .dock-item {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      width: 100%;
      height: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dock-item.active {
      color: var(--primary);
      background: rgba(0, 255, 255, 0.08);
      border-bottom: 2px solid var(--primary);
    }

    .dock-item:hover {
      color: var(--secondary);
      background: rgba(0, 255, 255, 0.05);
    }
  </style>
</head>

<body>

  <div id="safety-screen">
    <img src="https://i.ooxx.ooo/i/N2ZlN.jpg" alt="Flyz Logo" class="safety-logo">
    <div class="safety-title">Flyz Safety Unit V3</div>

    <div class="safety-card">
      <div class="check-item">
        <div class="check-icon" id="check1"></div>
        <div>浏览器环境检测</div>
      </div>

      <div class="check-item">
        <div class="check-icon" id="check2"></div>
        <div>系统安全状态检测</div>
      </div>

      <div class="check-item">
        <div class="check-icon" id="check3"></div>
        <div>网络环境验证</div>
      </div>

      <div class="check-item">
        <div class="check-icon" id="check4"></div>
        <div>人机验证</div>
      </div>

      <div class="safety-status" id="safety-status"></div>
    </div>
  </div>

  <div id="verify-modal">
    <div class="modal-card">
      <div class="modal-title">人机验证</div>
      <div class="verify-tip">请依次点击 1、2、3</div>
      <div class="verify-area" id="verify-area"></div>
      <div class="error-msg" id="verify-error">请按数字顺序点击</div>
    </div>
  </div>

  <div id="pages">
    <div class="iframe-wrap">
      <div class="iframe-loader" id="iframeLoader">
        <img src="https://img520.com/UIGuUV.jpeg" alt="2026 线上 FPV 竞速赛" class="iframe-loader-logo">
        <div class="iframe-loader-title">2026 线上 FPV 竞速赛</div>
        <div class="iframe-loader-text">页面加载中...</div>
      </div>
      <iframe src="https://917813.com.cn/fpv/gg" id="main-iframe"></iframe>
    </div>
  </div>

  <div id="dock">
    <div class="dock-item" data-target="home">【报名】</div>
    <div class="dock-item active" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">初赛</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    let isVerified = false;

    function isAllowedBrowser() {
      const ua = navigator.userAgent.toLowerCase();
      const isChrome = /chrome/.test(ua) && !/edge/.test(ua);
      const isSafari = /safari/.test(ua) && !/chrome/.test(ua);
      const isEdge = /edg/.test(ua);
      const isFirefox = /firefox/.test(ua);
      const isWeChat = /micromessenger/.test(ua);
      return isChrome || isSafari || isEdge || isFirefox || isWeChat;
    }

    function checkForeignIP(callback) {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "https://ipapi.co/json/", true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            callback(xhr.status === 200 ? JSON.parse(xhr.responseText).country_code !== "CN" : false);
          }
        };
        xhr.onerror = () => callback(false);
        xhr.send();
      } catch (err) {
        callback(false);
      }
    }

    function initVerify() {
      let clickOrder = [];
      const correctOrder = [0, 1, 2];
      const area = document.getElementById("verify-area");
      const error = document.getElementById("verify-error");

      function generateDots() {
        area.innerHTML = "";
        clickOrder = [];

        const w = area.offsetWidth;
        const h = area.offsetHeight;
        const size = 36;
        const pad = 12;

        for (let i = 0; i < 3; i++) {
          const x = Math.random() * (w - size - 2 * pad) + pad;
          const y = Math.random() * (h - size - 2 * pad) + pad;

          const dot = document.createElement("div");
          dot.className = "verify-dot";
          dot.style.left = x + "px";
          dot.style.top = y + "px";
          dot.dataset.index = i;
          dot.textContent = i + 1;

          dot.onclick = function() {
            const idx = parseInt(this.dataset.index);

            if (idx !== correctOrder[clickOrder.length]) {
              error.classList.add("active");
              setTimeout(() => error.classList.remove("active"), 1500);
              setTimeout(generateDots, 1500);
              return;
            }

            clickOrder.push(idx);
            this.classList.add("correct");

            if (clickOrder.length === 3) {
              document.getElementById("check4").textContent = "✔";
              document.getElementById("check4").className = "check-icon success";
              document.getElementById("verify-modal").classList.remove("active");

              document.getElementById("safety-status").textContent = "验证通过，正在进入赛事中心...";
              document.getElementById("safety-status").style.color = "var(--green)";

              setTimeout(() => {
                document.getElementById("safety-screen").classList.add("hidden");
                document.getElementById("pages").classList.add("active");
                isVerified = true;
              }, 1200);
            }
          };

          area.appendChild(dot);
        }
      }

      document.getElementById("verify-modal").classList.add("active");
      generateDots();
    }

    checkForeignIP(isForeign => {
      if (isForeign) {
        document.getElementById("safety-status").textContent = "境外 IP 暂不支持访问";
        document.getElementById("safety-status").style.color = "var(--red)";
        return;
      }

      if (!isAllowedBrowser()) {
        document.getElementById("safety-status").textContent = "浏览器不受支持";
        document.getElementById("safety-status").style.color = "var(--red)";
        return;
      }

      document.getElementById("check1").textContent = "✔";
      document.getElementById("check1").className = "check-icon success";

      document.getElementById("check2").textContent = "✔";
      document.getElementById("check2").className = "check-icon success";

      document.getElementById("check3").textContent = "✔";
      document.getElementById("check3").className = "check-icon success";

      setTimeout(initVerify, 1000);
    });

    const iframe = document.getElementById("main-iframe");
    const iframeLoader = document.getElementById("iframeLoader");
    let iframeLoaded = false;

    iframe.onload = () => {
      iframeLoaded = true;
      iframeLoader.style.display = "none";
    };

    setTimeout(() => {
      if (!iframeLoaded) iframeLoader.style.display = "none";
    }, 10000);

    const pages = ["home", "gg", "xs", "cs", "zz", "hq"];
    const urls = {
      home: "https://917813.com.cn/fpv/bm",
      gg: "https://917813.com.cn/fpv/gg",
      xs: "https://917813.com.cn/fpv/xs",
      cs: "https://917813.com.cn/fpv/cs",
      zz: "https://917813.com.cn/fpv/zz",
      hq: "https://917813.com.cn/fpv/hq"
    };

    document.querySelectorAll(".dock-item").forEach(item => {
      item.addEventListener("click", () => {
        if (!isVerified) return;

        const target = item.dataset.target;
        document.querySelectorAll(".dock-item").forEach(i => i.classList.remove("active"));
        item.classList.add("active");

        iframeLoader.style.display = "flex";
        iframeLoaded = false;
        iframe.src = urls[target];
      });
    });
  </script>

</body>
</html>
