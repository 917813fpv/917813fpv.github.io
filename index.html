<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="no-referrer">
  <!-- 还原最早原始标题 -->
  <title>赛事中心｜2026线上FPV竞速赛</title>

  <!-- 精简Cloudflare CDN：仅基础tailwind，极速加载 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/4.1.13/lib.min.js" integrity="sha512-5oT7+66hHZvR6hpz6s2A/mR+TtYG568YHj8zL29DY1plU0y0c2H90xS8eNWTL2e44Hawt00E0f0C+e084VkQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* 全局重置：消除所有默认边距，保证贴底无偏移 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    :root {
      --primary: #00ffff;
      --secondary: #66ccff;
      --dark: #050b14;
      --glow: 0 0 15px var(--primary), 0 0 30px rgba(0, 255, 255, 0.5);
      --bg-gradient: linear-gradient(135deg, #001528, #050b14);
    }

    * {
      box-sizing: border-box;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    body {
      font-family: "Inter", "Consolas", "Monaco", monospace;
      color: #fff;
      /* 替换为静态高饱和渐变背景：无动画，加载瞬间完成，跟住弹速 */
      background: var(--bg-gradient);
      /* 叠加一层高饱和主色光效，保留鲜艳度，无加载延迟 */
      background-image: radial-gradient(circle at center, rgba(0, 255, 255, 0.2), transparent 70%), var(--bg-gradient);
    }

    /* 开屏容器：全屏居中，无冗余，加载瞬间完成 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      background: rgba(5, 11, 20, 0.9);
      transition: opacity 0.5s ease;
    }

    /* Logo：完全保留原动画参数（弹速刚好，一字不改） */
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      box-shadow: var(--glow);
      border: 2px solid var(--primary);
      margin-bottom: 30px;
      transform: translateY(-200px) scale(0.95);
      opacity: 0;
      animation: logoDownBounce 0.8s cubic-bezier(0.2, 0.8, 0.2, 1.1) forwards 0.1s;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    /* 文字容器：保留原尺寸，不换行 */
    .text-container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    /* 主副文字：完全保留原动画参数（弹速刚好，一字不改） */
    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 15px;
      color: var(--primary);
      text-shadow: var(--glow);
      transform: translateY(80px);
      opacity: 0;
      animation: textUpBounce 0.7s cubic-bezier(0.2, 0.8, 0.2, 1.1) forwards 0.5s;
    }

    .sub-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--secondary);
      text-shadow: 0 0 10px var(--secondary);
      transform: translateY(80px);
      opacity: 0;
      animation: textUpBounce 0.7s cubic-bezier(0.2, 0.8, 0.2, 1.1) forwards 0.5s;
    }

    /* 动画关键帧：完全保留原参数，弹速不变 */
    @keyframes logoDownBounce {
      0% { transform: translateY(-200px) scale(0.95); opacity: 0; }
      80% { transform: translateY(10px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes textUpBounce {
      0% { transform: translateY(80px); opacity: 0; }
      80% { transform: translateY(-5px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 主内容区：保留原逻辑，适配Dock栏高度 */
    #pages {
      position: fixed;
      inset: 0 0 52px 0; /* 底部留Dock栏高度，避免内容被挡 */
      z-index: 10;
      display: none;
    }

    #pages.active {
      display: block;
    }

    .iframe-wrap {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Dock栏：强制贴死设备最底部（核心优化） */
    #dock {
      position: fixed;
      inset: auto 0 0 0; /* 上下左右精准定位，贴死最底部 */
      height: 52px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      /* 适配刘海屏/灵动岛，贴死物理底部 */
      padding-bottom: env(safe-area-inset-bottom);
      height: calc(52px + env(safe-area-inset-bottom));
    }

    .dock-item {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      width: 100%;
      height: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dock-item.active {
      color: var(--primary);
      background: rgba(0, 255, 255, 0.08);
      border-bottom: 2px solid var(--primary);
    }

    .dock-item:hover {
      color: var(--secondary);
      background: rgba(0, 255, 255, 0.05);
    }

    /* 开屏淡出：保留原3秒逻辑 */
    .splash-fade {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- 开屏容器：无多余背景层，加载极速 -->
  <div id="splash-screen">
    <div class="splash-logo">
      <img src="/logo.JPG" alt="Flyz远征飞" />
    </div>
    <div class="text-container">
      <div class="main-title">2026线上FPV竞速赛</div>
      <div class="sub-title">Flyz远征飞 · 为模友而生</div>
    </div>
  </div>

  <!-- 主内容区：底部留Dock栏高度，内容不被挡 -->
  <div id="pages">
    <div class="iframe-wrap">
      <iframe src="/fpv/2026onlinerace/bm/index.html" id="main-iframe"></iframe>
    </div>
  </div>

  <!-- Dock栏：强制贴死最底部，适配异形屏 -->
  <div id="dock">
    <div class="dock-item active" data-target="home">【报名】</div>
    <div class="dock-item" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">初赛</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    // 完全保留原JS逻辑，无任何修改
    document.addEventListener("DOMContentLoaded", () => {
      const splashScreen = document.getElementById('splash-screen');
      const pages = document.getElementById('pages');

      // 3秒准时淡出，保留原动画节奏
      setTimeout(() => {
        splashScreen.classList.add('splash-fade');
        setTimeout(() => {
          pages.classList.add('active');
        }, 500);
      }, 3000);

      // 导航切换逻辑：原封不动
      const urls = {
        home: "/fpv/2026onlinerace/bm/index.html",
        gg: "/fpv/2026onlinerace/gg/index.html",
        xs: "/fpv/2026onlinerace/xs/index.html",
        cs: "/fpv/2026onlinerace/cs/index.html",
        zz: "/fpv/2026onlinerace/zz/index.html",
        hq: "/fpv/2026onlinerace/hq/index.html"
      };

      document.querySelectorAll(".dock-item").forEach(item => {
        item.addEventListener("click", function() {
          const target = this.dataset.target;
          if (!urls[target]) return;

          document.querySelectorAll(".dock-item").forEach(i => i.classList.remove("active"));
          this.classList.add("active");
          document.getElementById("main-iframe").src = urls[target];
        });
      });
    });
  </script>
</body>
</html>
