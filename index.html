<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>赛事中心｜2026线上FPV竞速赛</title>
  <!-- 若需引入Cloudflare CDN的CSS/JS，直接加此处（如下示例，当前原生无需） -->
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
  <style>
    :root {
      --primary: #00ffff;
      --secondary: #87CEFA;
      --bg-deep: #000000;
      --bg-dark: #050505;
      --dock-h: 58px;
      /* Dock极简玻璃态：仅基础模糊+低透背景，无多层特效 */
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.2);
      /* 轻量发光：无多层叠加，简洁不刺眼 */
      --glow-primary: 0 0 8px var(--primary), 0 0 16px rgba(0, 255, 255, 0.3);
      --glow-secondary: 0 0 8px var(--secondary), 0 0 16px rgba(135, 206, 250, 0.3);
      --glow-text: 0 0 2px #fff, 0 0 4px rgba(255, 255, 255, 0.7);
      /* 统一轻量过渡 */
      --trans-fast: 0.2s ease-out;
      --trans-smooth: 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      --trans-fade: 0.4s ease-in-out;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    *::-webkit-scrollbar { display: none; }
    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Consolas", monospace;
      background: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 50%, rgba(10, 30, 40, 0.25), transparent 70%);
      color: #fff;
      touch-action: pan-y;
    }
    /* 开屏动画：保留核心美化，无冗余 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      transition: opacity var(--trans-fade), pointer-events 0s linear var(--trans-fade);
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      border: 2px solid var(--primary);
      box-shadow: var(--glow-primary);
      margin-bottom: 48px;
      transform: translateY(-300px) scale(0.85);
      opacity: 0;
      animation: logoDownBounce var(--trans-smooth) forwards 0.1s;
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      filter: brightness(1.05);
    }
    .splash-main-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 24px;
      color: var(--primary);
      text-shadow: var(--glow-primary);
      letter-spacing: 2px;
      transform: translateY(150px);
      opacity: 0;
      animation: textUpBounce var(--trans-smooth) forwards 0.5s;
    }
    .splash-url {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--secondary);
      text-shadow: var(--glow-secondary);
      letter-spacing: 2px;
      font-family: Consolas, monospace;
      transform: translateY(150px);
      opacity: 0;
      animation: textUpBounce var(--trans-smooth) forwards 0.5s;
      padding: 6px 18px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(135,206,250,0.2);
    }
    @keyframes logoDownBounce {
      0% { transform: translateY(-300px) scale(0.85); opacity: 0; }
      75% { transform: translateY(10px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes textUpBounce {
      0% { transform: translateY(150px); opacity: 0; }
      75% { transform: translateY(-6px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    /* 主内容区：保留布局，无冗余样式 */
    #pages {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(var(--dock-h) + env(safe-area-inset-bottom));
      bottom: calc(var(--dock-h) + -webkit-env(safe-area-inset-bottom));
      z-index: 10;
      background: var(--bg-dark);
      overflow: hidden;
      display: none;
      border-radius: 0 0 16px 16px;
    }
    #pages.active { display: block; }
    .page-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--trans-fade);
    }
    .page-container.active {
      opacity: 1;
      pointer-events: all;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-dark);
      display: block;
    }
    /* Dock栏：极致精简！删除所有多层特效，仅基础玻璃态+轻量动效 */
    #dock {
      position: fixed !important;
      bottom: env(safe-area-inset-bottom) !important;
      bottom: -webkit-env(safe-area-inset-bottom) !important;
      left: 0 !important;
      right: 0 !important;
      height: var(--dock-h);
      z-index: 20;
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      /* 极简玻璃态：仅一层模糊+边框+轻微阴影，无多层嵌套 */
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--glass-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    /* Dock项：无伪元素/多层框，仅颜色+发光+底部边框的轻量变化 */
    .dock-item {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: var(--glow-text);
      cursor: pointer;
      transition: all var(--trans-fast);
      border-bottom: 3px solid transparent;
    }
    /* hover：仅轻量颜色+发光变化，无额外框体 */
    .dock-item:hover {
      color: var(--secondary);
      text-shadow: var(--glow-secondary), var(--glow-text);
      background: rgba(135, 206, 250, 0.05);
    }
    /* 选中：仅青蓝底部边框+主色发光，简洁辨识度高 */
    .dock-item.active {
      color: var(--primary);
      text-shadow: var(--glow-primary), var(--glow-text);
      border-bottom: 3px solid var(--primary);
      background: rgba(0, 255, 255, 0.06);
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo">
      <img src="./logo.JPG" alt="Flyz远征飞" />
    </div>
    <div class="splash-main-title">2026线上FPV竞速赛</div>
    <div class="splash-url">cdn.917813.com.cn</div>
  </div>

  <div id="pages">
    <div class="page-container active" data-target="home">
      <iframe src="/fpv/2026onlinerace/bm/index.html"></iframe>
    </div>
    <div class="page-container" data-target="gg">
      <iframe src="/fpv/2026onlinerace/gg/index.html"></iframe>
    </div>
    <div class="page-container" data-target="xs">
      <iframe src="/fpv/2026onlinerace/xs/index.html"></iframe>
    </div>
    <div class="page-container" data-target="cs">
      <iframe src="/fpv/2026onlinerace/cs/index.html"></iframe>
    </div>
    <div class="page-container" data-target="zz">
      <iframe src="/fpv/2026onlinerace/zz/index.html"></iframe>
    </div>
    <div class="page-container" data-target="hq">
      <iframe src="/fpv/2026onlinerace/hq/index.html"></iframe>
    </div>
  </div>

  <div id="dock">
    <div class="dock-item active" data-target="home">【报名】</div>
    <div class="dock-item" data-target="gg">公告</div>
    <div class="dock-item" data-target="xs">选手</div>
    <div class="dock-item" data-target="cs">初赛</div>
    <div class="dock-item" data-target="zz">赞助</div>
    <div class="dock-item" data-target="hq">后勤</div>
  </div>

  <script>
    // 纯原生JS，无任何外部依赖，若需Cloudflare CDN的JS，直接在head引入
    document.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById('splash-screen');
      const pages = document.getElementById('pages');
      const dockItems = document.querySelectorAll('.dock-item');
      const pageContainers = document.querySelectorAll('.page-container');
      let currentTarget = 'home';

      // 开屏动画3秒淡出
      setTimeout(() => {
        splash.style.opacity = 0;
        splash.style.pointerEvents = 'none';
        setTimeout(() => pages.classList.add('active'), 300);
      }, 3000);

      // 极简切页逻辑
      const switchPage = (target) => {
        if (target === currentTarget) return;
        dockItems.forEach(item => item.classList.remove('active'));
        pageContainers.forEach(cont => cont.classList.remove('active'));
        document.querySelector(`.dock-item[data-target="${target}"]`).classList.add('active');
        document.querySelector(`.page-container[data-target="${target}"]`).classList.add('active');
        currentTarget = target;
      };

      // 绑定点击事件
      dockItems.forEach(item => item.addEventListener('click', () => switchPage(item.dataset.target)));
    });
  </script>
</body>
</html>
