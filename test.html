<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>2026线上FPV竞速赛-魄客杯-Flyz远征飞</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    html { height: 100%; overflow-x: hidden; }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(120deg, #00f5ff, #7928ca, #ff0080);
      background-size: 400% 400%;
      animation: bgAnimate 10s ease infinite;
    }

    /* 视频容器：彩色动态背景替代黑边 */
    .video-container {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vw;
      background: linear-gradient(45deg, #ff6bd5, #00f5ff, #7928ca, #ffea00);
      background-size: 600% 600%;
      animation: videoBgAnimate 8s linear infinite;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 100vw;
      max-height: 80vh;
      border-radius: 28px;
      border: 4px solid #ffffff;
      box-shadow: 0 0 40px rgba(255,255,255,0.8), 0 0 20px rgba(0,245,255,0.6) inset;
      overflow: hidden;
    }

    /* 视频控制限制：隐藏进度条/禁止拖动 */
    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      volume: 1; /* 默认最大音量 */
    }

    /* 隐藏视频原生控制栏（自定义交互） */
    #video-player::-webkit-media-controls {
      display: none !important;
    }
    #video-player {
      -webkit-appearance: none;
      appearance: none;
    }

    /* 点击提示文字：双位置+背景+上下跳跃动画 无发光 */
    .click-prompt {
      position: fixed;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 8px 20px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6); /* 黑色半透明背景 提升可读性 */
      backdrop-filter: blur(3px);
      pointer-events: none; /* 不阻挡点击 */
      animation: jumpPrompt 2s ease-in-out infinite;
    }

    /* 上半部分提示（偏上） */
    .prompt-top {
      top: 30%;
    }

    /* 下半部分提示（偏下） */
    .prompt-bottom {
      top: 70%;
    }

    /* 加载动画 */
    .loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    .loading-core {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .loading-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: ringRotate 2s ease-in-out infinite;
    }

    .ring1 {
      border-top-color: #ffea00;
      border-right-color: #ffea00;
      animation-delay: 0s;
      box-shadow: 0 0 15px rgba(255,234,0,0.8);
    }

    .ring2 {
      border-bottom-color: #00f5ff;
      border-left-color: #00f5ff;
      animation-delay: 0.3s;
      box-shadow: 0 0 15px rgba(0,245,255,0.8);
    }

    .ring3 {
      border-top-color: #ff6bd5;
      border-bottom-color: #ff6bd5;
      animation-delay: 0.6s;
      box-shadow: 0 0 15px rgba(255,107,213,0.8);
    }

    .loading-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(255,255,255,1);
      animation: dotPulse 1.5s ease infinite;
    }

    .loading-text {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255,255,255,0.9);
      animation: textFloat 3s ease-in-out infinite;
    }

    /* 错误提示 */
    .error {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      color: #ffffff;
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.8s ease forwards;
    }

    .error-text {
      font-size: 1.4rem;
      line-height: 2;
      max-width: 450px;
      text-shadow: 0 0 15px rgba(255,0,128,0.8);
    }

    .error-reload {
      padding: 14px 40px;
      border-radius: 16px;
      background: linear-gradient(90deg, #ffea00, #ff6bd5);
      color: #000000;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255,234,0,0.8);
      border: none;
    }

    .error-reload:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(255,234,0,1);
    }

    /* 动画定义 */
    @keyframes bgAnimate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes videoBgAnimate {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes ringRotate {
      0% { transform: rotate(0deg); opacity: 0.8; }
      50% { opacity: 1; }
      100% { transform: rotate(360deg); opacity: 0.8; }
    }

    @keyframes dotPulse {
      0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 10px rgba(255,255,255,1); }
      50% { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 20px rgba(255,255,255,1); }
      100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 10px rgba(255,255,255,1); }
    }

    @keyframes textFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    /* 上下跳跃动画 无发光 */
    @keyframes jumpPrompt {
      0% { transform: translate(-50%, -50%) translateY(-8px); }
      50% { transform: translate(-50%, -50%) translateY(8px); }
      100% { transform: translate(-50%, -50%) translateY(-8px); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div class="loading" id="loading">
    <div class="loading-core">
      <div class="loading-ring ring1"></div>
      <div class="loading-ring ring2"></div>
      <div class="loading-ring ring3"></div>
      <div class="loading-dot"></div>
    </div>
    <div class="loading-text">加载中...</div>
  </div>

  <!-- 双位置点击提示：上半部分+下半部分 带背景+上下跳跃 -->
  <div class="click-prompt prompt-top">点击屏幕任意位置播放</div>
  <div class="click-prompt prompt-bottom">点击屏幕任意位置播放</div>

  <!-- 视频容器 -->
  <div class="video-container" id="videoContainer">
    <div class="video-wrapper">
      <video 
        id="video-player" 
        playsinline 
        webkit-playsinline 
        preload="auto"
      >
        <p>您的浏览器不支持HTML5视频播放，请升级浏览器后重试。</p>
      </video>
    </div>
  </div>

  <div class="error" id="error">
    <div class="error-text">视频加载失败<br>请检查网络或点击下方按钮刷新重试</div>
    <button class="error-reload" onclick="window.location.reload()">刷新页面</button>
  </div>

  <script>
    'use strict';

    const CONFIG = {
      baseUrl: 'https://cdn.917813.com.cn/fpv/2026onlinerace/video/',
      videoUrls: {
        apple: 'apple.MP4',
        android: 'hw.mp4'
      },
      selectors: {
        loading: '#loading',
        clickPrompts: '.click-prompt',
        videoContainer: '#videoContainer',
        player: '#video-player',
        error: '#error'
      },
      jumpTimeout: 30000 // 30秒兜底跳转（仅播放结束未跳转时触发）
    };

    const el = {};
    Object.keys(CONFIG.selectors).forEach(key => {
      if (key === 'clickPrompts') {
        el[key] = document.querySelectorAll(CONFIG.selectors[key]);
      } else {
        el[key] = document.querySelector(CONFIG.selectors[key]);
      }
    });

    let jumpTimer = null;
    let isPlayed = false;

    // 设备识别
    function autoDetectDevice() {
      const ua = navigator.userAgent.toLowerCase();
      const videoPath = /iphone|ipad|ipod|macintosh/.test(ua)
        ? CONFIG.videoUrls.apple
        : CONFIG.videoUrls.android;
      return CONFIG.baseUrl + videoPath;
    }

    // 初始化视频
    function initVideo() {
      const videoUrl = autoDetectDevice();
      el.player.src = videoUrl;
      el.player.volume = 1; // 设置默认最大音量

      // 加载完成后显示提示文字
      el.player.addEventListener('loadeddata', () => {
        hideLoading();
        // 启动30秒兜底跳转（仅播放结束未跳转时生效）
        startJumpTimer();
      });

      // 点击屏幕任意位置触发播放
      document.addEventListener('click', () => {
        if (!isPlayed) {
          isPlayed = true;
          // 两个提示文字同时渐变消失
          el.clickPrompts.forEach(prompt => {
            prompt.style.animation = 'fadeOut 0.5s ease forwards';
            setTimeout(() => {
              prompt.style.display = 'none';
            }, 500);
          });
          // 触发播放
          el.player.play().then(() => {
            console.log('视频播放启动');
          }).catch(err => {
            // 播放失败提示刷新
            el.error.querySelector('.error-text').textContent = '播放失败，请点击刷新重试';
            el.error.style.display = 'flex';
            clearTimeout(jumpTimer);
          });
        }
      }, { once: true });

      // 播放结束自动跳转
      el.player.addEventListener('ended', () => {
        triggerJump();
      });

      // 加载失败
      el.player.addEventListener('error', () => {
        clearTimeout(jumpTimer);
        el.loading.style.display = 'none';
        el.clickPrompts.forEach(prompt => prompt.style.display = 'none');
        el.error.style.display = 'flex';
      });
    }

    // 触发跳转
    function triggerJump() {
      clearTimeout(jumpTimer);
      window.location.href = './index.html';
    }

    // 启动30秒兜底跳转（仅当播放结束未跳转时触发）
    function startJumpTimer() {
      jumpTimer = setTimeout(() => {
        // 检查视频是否已结束，未结束则不跳转
        if (el.player.ended) {
          triggerJump();
        } else {
          // 视频未结束，重置定时器
          clearTimeout(jumpTimer);
          startJumpTimer();
        }
      }, CONFIG.jumpTimeout);
    }

    // 隐藏加载提示
    function hideLoading() {
      el.loading.style.animation = 'fadeOut 0.5s ease forwards';
      setTimeout(() => {
        el.loading.style.display = 'none';
      }, 500);
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', () => {
      initVideo();
    });
  </script>
</body>
</html>
