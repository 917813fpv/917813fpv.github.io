<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <script>
    // ========== 深度全套伪装 伪装站点：111.228.61.60:2364 ==========
    const fakeHost = "111.228.61.60";
    const fakePort = "2364";
    const fakeOrigin = `http://${fakeHost}:${fakePort}`;

    // 1. 锁死top/self/parent 防嵌套检测
    window.top = window.self;
    window.parent = window.self;
    Object.defineProperty(window, 'top', {value: window.self, writable: false, configurable: false});
    Object.defineProperty(window, 'parent', {value: window.self, writable: false, configurable: false});

    // 2. 劫持 location 全套信息
    Object.defineProperty(location, 'hostname', {value: fakeHost, configurable: false});
    Object.defineProperty(location, 'host', {value: `${fakeHost}:${fakePort}`, configurable: false});
    Object.defineProperty(location, 'port', {value: fakePort, configurable: false});
    Object.defineProperty(location, 'origin', {value: fakeOrigin, configurable: false});

    // 3. 伪装来路 Referrer
    Object.defineProperty(document, 'referrer', {value: fakeOrigin + "/", configurable: false});

    // 4. 屏蔽框架检测属性
    Object.defineProperty(window, 'frameElement', {value: undefined, configurable: false});
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;

        }

        /* JS加载进度弹窗 */
        .load-progress-wrap {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        .progress-text {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
        }
        .progress-bar-box {
            width: 280px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-inner {
            height: 100%;
            width: 0%;

            transition: 0.1s;
        }

        /* 开屏免责声明弹窗 */
        .disclaimer-popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            animation: popFadeIn 0.5s ease forwards;
        }
        @keyframes popFadeIn {
            to { opacity: 1; }
        }
        .pop-box {
            width: 85%;
            max-width: 400px;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transform: scale(0.8);
            animation: popScale 0.5s ease forwards;
        }
        @keyframes popScale {
            to { transform: scale(1); }
        }
        .pop-box h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #fff;
        }
        .pop-box p {
            font-size: 14px;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 25px;
        }
        .pop-btn {
            padding: 10px 30px;
            border-radius: 30px;
            background: #fe2c55;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        /* 主容器默认隐藏，等脚本缓存就绪再显示 */
        .main-container {
            display: none;
        }
        .main-container,
        .video-section,
        .video-container,
        .video-wrapper {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* 加载动画 */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9;
        }
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 右侧悬浮按钮 */
        .ctrl-side {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .ctrl-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        /* 自定义进度条 */
        .progress-wrap {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 80px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            z-index: 10;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #fe2c55;
            border-radius: 3px;
            position: relative;
        }
        .progress-dot {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }

        /* 底部按钮 */
        .bottom-ctrl {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .bottom-btn {
            padding: 8px 16px;
            border-radius: 24px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .bottom-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        /* 首次播放提示 */
        .play-tip {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .tip-content {
            text-align: center;
        }
        .tip-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }
        .tip-text {
            font-size: 15px;
            margin-bottom: 18px;
            opacity: 0.9;
        }
        .tip-btn {
            padding: 10px 26px;
            border-radius: 24px;
            background: #fe2c55;
            color: #fff;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* 动态水印 */
        .watermark {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 8;
        }
        .watermark-text {
            position: absolute;
            color: rgba(255,255,255,0.1);
            font-size: 14px;
            white-space: nowrap;
            animation: floatMove 10s ease-in-out infinite alternate;
        }
        @keyframes floatMove {
            0% { transform: translate(0, 0) rotate(-6deg); }
            100% { transform: translate(60px, 80px) rotate(6deg); }
        }

        /* 隐藏冗余模块 */
        .video-info,.front-stats,.footer {
            display: none !important;
        }
        /* 手机适配 */
        @media (max-width: 480px) {
            .ctrl-side { right: 8px; gap: 16px; }
            .ctrl-btn { width: 38px; height: 38px; font-size: 16px; }
            .bottom-ctrl { bottom: 20px; gap: 8px; }
            .bottom-btn { padding: 6px 12px; font-size: 12px; }
            .progress-wrap { bottom: 60px; }
        }
    </style>
</head>
<body>
<!-- JS加载进度页 -->
<div class="load-progress-wrap" id="loadProgressWrap">
    <div class="progress-text" id="progressText">资源加载中 0%</div>
    <div class="progress-bar-box">
        <div class="progress-inner" id="progressInner"></div>
    </div>
</div>

<!-- 开屏免责声明弹窗 -->
<div class="disclaimer-popup" id="disclaimerPop" style="display:none;">
    <div class="pop-box">
        <h3>免责声明</h3>
        <p>本站所有视频内容均来源于网络，仅供个人娱乐和学习交流使用。所有版权归原作者所有。如涉及侵权，请及时联系我们删除。</p>
        <button class="pop-btn" id="agreeBtn">我已阅读并同意</button>
    </div>
</div>

<main class="main-container" id="mainPage">
    <section class="video-section">
        <div class="video-container">
            <div class="video-wrapper">
                <video id="player" controlslist="nodownload" webkit-playsinline playsinline muted
                       data-api="http://av.npcq.cn/pc.php" data-source="external" data-version="v2.1">
                    您的浏览器不支持视频播放
                </video>

                <!-- 动态水印 -->
                <div class="watermark" id="watermarkBox"></div>

                <!-- 自定义进度条 -->
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-dot"></div>
                    </div>
                </div>

                <!-- 右侧控制按钮 -->
                <div class="ctrl-side">
                    <button id="playPauseBtn" class="ctrl-btn" title="暂停/播放">
                        <i class="fa fa-play"></i>
                    </button>
                    <button id="muteBtn" class="ctrl-btn" title="静音/取消静音">
                        <i class="fa fa-volume-off"></i>
                    </button>
                    <button id="next" class="ctrl-btn" title="下一位 (快捷键: N)">
                        <i class="fa fa-step-forward"></i>
                    </button>
                </div>

                <!-- 底部按钮 -->
                <div class="bottom-ctrl">
                    <button id="switch" class="bottom-btn">自动切换: 开</button>
                    <button id="themeToggle" class="bottom-btn">🌗 深色模式</button>
                </div>

                <!-- 首次播放提示 -->
                <div id="firstPlayTip" class="play-tip">
                    <div class="tip-content">
                        <div class="tip-icon"><i class="fa fa-play-circle"></i></div>
                        <div class="tip-text">点击开始观看</div>
                        <button id="startPlay" class="tip-btn">开始观看</button>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
// 配置
const JS_URL = "https://cdn.917813.com.cn/video/gril.js";
const CACHE_KEY = "gril_js_cache";

// DOM
const loadProgressWrap = document.getElementById('loadProgressWrap');
const progressText = document.getElementById('progressText');
const progressInner = document.getElementById('progressInner');
const disclaimerPop = document.getElementById('disclaimerPop');
const mainPage = document.getElementById('mainPage');

// 初始化：优先读本地缓存
initLoad();

function initLoad() {
    // 有缓存直接加载缓存
    const cache = localStorage.getItem(CACHE_KEY);
    if (cache) {
        runScript(cache);
        finishLoad();
        return;
    }
    // 无缓存 带进度下载
    downloadJsWithProgress();
}

// 带进度下载JS
function downloadJsWithProgress() {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', JS_URL, true);
    xhr.responseType = 'text';

    // 监听下载进度
    xhr.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
            let percent = Math.round((e.loaded / e.total) * 100);
            progressInner.style.width = percent + '%';
            progressText.innerText = `资源加载中 ${percent}%`;
        }
    });

    // 下载完成
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            const jsCode = xhr.responseText;
            // 存入本地缓存
            localStorage.setItem(CACHE_KEY, jsCode);
            // 执行脚本
            runScript(jsCode);
            finishLoad();
        }
    };

    xhr.onerror = function() {
        progressText.innerText = "加载失败，请刷新重试";
    };

    xhr.send();
}

// 运行JS代码
function runScript(code) {
    const script = document.createElement('script');
    script.textContent = code;
    document.head.appendChild(script);
}

// 加载完成：关闭进度页，弹出免责
function finishLoad() {
    loadProgressWrap.style.display = 'none';
    disclaimerPop.style.display = 'flex';
    mainPage.style.display = 'block';
}

// 免责同意按钮
document.getElementById('agreeBtn').addEventListener('click', function(){
    disclaimerPop.style.display = 'none';
});

// 动态水印
(function(){
    const wmBox = document.getElementById('watermarkBox');
    const wmText = '111.228.61.60:2364';
    for(let i = 0; i < 18; i++){
        let item = document.createElement('div');
        item.className = 'watermark-text';
        item.innerText = wmText;
        item.style.top = Math.random() * 100 + '%';
        item.style.left = Math.random() * 100 + '%';
        item.style.animationDelay = Math.random() * 4 + 's';
        wmBox.appendChild(item);
    }
})();

// 播放器控制逻辑
const player = document.getElementById('player');
const playPauseBtn = document.getElementById('playPauseBtn');
const muteBtn = document.getElementById('muteBtn');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');

// 播放暂停
playPauseBtn.addEventListener('click', () => {
    if(player.paused){
        player.play();
        playPauseBtn.innerHTML = '<i class="fa fa-pause"></i>';
    }else{
        player.pause();
        playPauseBtn.innerHTML = '<i class="fa fa-play"></i>';
    }
});

// 静音切换
muteBtn.addEventListener('click', () => {
    player.muted = !player.muted;
    muteBtn.innerHTML = player.muted ? '<i class="fa fa-volume-off"></i>' : '<i class="fa fa-volume-up"></i>';
});

// 播放状态同步图标
player.addEventListener('play', ()=>{
    playPauseBtn.innerHTML = '<i class="fa fa-pause"></i>';
});
player.addEventListener('pause', ()=>{
    playPauseBtn.innerHTML = '<i class="fa fa-play"></i>';
});

// 自定义进度条更新
player.addEventListener('timeupdate', function(){
    let percent = (player.currentTime / player.duration) * 100;
    if(!isNaN(percent)){
        progressBar.style.width = percent + '%';
    }
});

// 进度条拖动
progressWrap.addEventListener('click', function(e){
    let rect = progressWrap.getBoundingClientRect();
    let pos = (e.clientX - rect.left) / rect.width;
    if(player.duration){
        player.currentTime = pos * player.duration;
    }
});
</script>
</body>
</html>
