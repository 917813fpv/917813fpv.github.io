<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线上 Uncrashed FPV 竞速赛｜海报</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root {
  --red: #ff3333;
  --blue: #0099ff;
  --yellow: #ffcc00;
  --green: #33cc33;
  --pink: #ff66cc;
  --white: #fff;
}
body {
  background: 
    linear-gradient(45deg, rgba(0,153,255,0.8), rgba(255,102,204,0.7), rgba(255,204,0,0.7)),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: var(--white);
  padding: 30px 20px;
  text-align: center;
}
.logo {
  width: 200px;
  border-radius: 24px;
  border: 4px solid var(--yellow);
  box-shadow: 0 0 80px rgba(255,204,0,0.7);
  margin-bottom: 20px;
}
h1 {
  font-size: 5.5rem;
  font-weight: 900;
  color: var(--blue);
  -webkit-text-stroke: 0.5px rgba(255,255,255,0.7);
  margin-bottom: 5px;
}
h2 {
  font-size: 4.5rem;
  font-weight: 900;
  color: var(--red);
  -webkit-text-stroke: 0.5px rgba(255,255,255,0.7);
  margin-bottom: 15px;
}
h3 {
  font-size: 2.8rem;
  color: var(--yellow);
  -webkit-text-stroke: 0.3px rgba(255,255,255,0.7);
  margin-bottom: 12px;
}
p {
  font-size: 2.2rem;
  margin-bottom: 8px;
  -webkit-text-stroke: 0.3px rgba(255,255,255,0.7);
}
.highlight {
  color: var(--green);
  font-weight: 900;
}
.qr {
  width: 260px;
  border-radius: 16px;
  margin: 20px 0;
  border: 3px solid var(--blue);
  box-shadow: 0 0 60px rgba(0,153,255,0.7);
}
.website {
  font-size: 3.2rem;
  color: var(--green);
  font-weight: 900;
  -webkit-text-stroke: 0.3px rgba(255,255,255,0.7);
  margin-bottom: 15px;
}
.footer {
  font-size: 2rem;
}
.footer-highlight {
  color: var(--pink);
  font-weight: 900;
}
.tech {
  font-size: 1.8rem;
  color: var(--blue);
  margin-top: 6px;
}
#captureBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1.2rem;
  opacity: 0.2;
  cursor: pointer;
  transition: opacity 0.3s;
  z-index: 1000;
}
#captureBtn:hover {
  opacity: 1;
}
</style>
</head>
<body>

<img src="https://img520.com/UIGuUV.jpeg" class="logo">

<h1>线上 Uncrashed</h1>
<h2>FPV 竞速赛</h2>

<h3>🔥 欢迎报名！赛事全信息一站获取 🔥</h3>

<p>报名通道 | 赛事详情 | 赞助商 | 参赛选手</p>
<p>👉 所有信息 <span class="highlight">尽在赛事官网</span> 👈</p>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https://917813.com.cn&color=ffffff&bgcolor=000000&margin=2" class="qr">

<p class="website">917813.com.cn</p>

<div class="footer">
  <p>Flyz远征飞 & <span class="footer-highlight">魄客科技-世界纪录保持者147签名认可</span></p>
  <p class="tech">技术支持：YZBJFPV.top</p>
</div>

<button id="captureBtn">保存海报（高清）</button>

<script>
document.getElementById("captureBtn").addEventListener("click", function() {
  this.style.opacity = 0;

  // 关键修复：使用 document.body 并自动计算高度
  html2canvas(document.body, {
    scale: 2,
    useCORS: true,
    logging: false,
    letterRendering: true,
    scrollX: 0,
    scrollY: 0
  }).then(canvas => {
    let link = document.createElement("a");
    link.download = "线上Uncrashed_FPV竞速赛海报.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    this.style.opacity = 0.2;
  });
});
</script>

</body>
</html>
