<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线上 Uncrashed FPV 竞速赛｜宣传海报</title>
<style>
:root {
  --red: #ff3333;
  --blue: #0099ff;
  --yellow: #ffcc00;
  --green: #33cc33;
  --pink: #ff66cc;
  --black: #000;
  --white: #fff;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: 
    linear-gradient(45deg, rgba(0,153,255,0.8), rgba(255,102,204,0.7), rgba(255,204,0,0.7)),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  color: var(--white);
  display: flex;
  justify-content: center;
  align-items: center;
}
.poster {
  width: 100%;
  max-width: 900px;
  height: 95vh;
  background: rgba(0,0,0,0.35); /* 遮罩从 0.65 → 0.35，变得更亮 */
  border-radius: 30px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  position: relative;
  box-shadow: 0 0 120px rgba(255,255,255,0.45),
              inset 0 0 60px rgba(0,0,0,0.2);
}
.header {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
.logo {
  width: 180px;
  height: 180px;
  border-radius: 24px;
  border: 4px solid var(--yellow);
  box-shadow: 0 0 80px rgba(255,204,0,0.6);
  object-fit: cover;
}
.title-group {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.main-title {
  font-size: 4.2rem;
  font-weight: 900;
  color: var(--blue);
  line-height: 1.1;
}
.race-title {
  font-size: 3.8rem;
  font-weight: 900;
  color: var(--red);
  line-height: 1.1;
}
.subtitle {
  font-size: 2.2rem;
  color: var(--yellow);
  margin: 20px 0;
  font-weight: 700;
}
.info-section {
  width: 100%;
  margin: 10px 0;
}
.info {
  font-size: 1.8rem;
  color: var(--white);
  margin-bottom: 12px;
  font-weight: 600;
}
.highlight {
  color: var(--green);
  font-weight: 800;
}
.qr-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin: 20px 0;
}
.qr-box {
  padding: 20px;
  border: 3px solid var(--blue);
  border-radius: 20px;
  background: rgba(0,0,0,0.6);
  box-shadow: 0 0 60px rgba(0,153,255,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.qr {
  width: 220px;
  height: 220px;
  border-radius: 12px;
  margin-bottom: 15px;
}
.qr-tip {
  font-size: 1.6rem;
  color: var(--yellow);
  font-weight: 700;
}
.website {
  font-size: 2.5rem;
  color: var(--green);
  font-weight: 800;
  letter-spacing: 2px;
  margin: 15px 0;
}
.footer {
  width: 100%;
  margin-top: 20px;
}
.footer-text {
  font-size: 1.5rem;
  color: var(--white);
  margin-bottom: 8px;
  font-weight: 500;
}
.footer-highlight {
  color: var(--pink);
  font-weight: 700;
}
.tech-support {
  font-size: 1.4rem;
  color: var(--blue);
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="poster">
  <div class="header">
    <img src="https://img520.com/UIGuUV.jpeg" class="logo" alt="Flyz Logo">
    <div class="title-group">
      <div class="main-title">线上 Uncrashed</div>
      <div class="race-title">FPV 竞速赛</div>
    </div>
  </div>

  <div class="subtitle">🔥 欢迎报名！赛事全信息一站获取 🔥</div>

  <div class="info-section">
    <div class="info">报名通道 | 赛事详情 | 赞助商 | 参赛选手</div>
    <div class="info">👉 所有信息 <span class="highlight">尽在赛事官网</span> 👉</div>
  </div>

  <div class="qr-container">
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://917813.com.cn&color=ffffff&bgcolor=000000&margin=2" class="qr" alt="赛事官网二维码">
      <div class="qr-tip">扫码进入 · 立即报名</div>
    </div>
  </div>

  <div class="website">917813.com.cn</div>

  <div class="footer">
    <div class="footer-text">Flyz远征飞 & <span class="footer-highlight">魄客科技-世界纪录保持者147签名认可</span></div>
    <div class="tech-support">技术支持：YZBJFPV.top</div>
  </div>
</div>

</body>
</html>
