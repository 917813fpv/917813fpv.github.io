<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML预览 - 917813</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                            orange: '#f97316',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 50%, #ffffff 100%);
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .gradient-text {
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6, #ec4899);
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.15), 0 12px 24px -8px rgba(139, 92, 246, 0.1);
            border-color: rgba(14, 165, 233, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.35), 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            animation: float 10s ease-in-out infinite;
        }

        .grid-pattern {
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(14, 165, 233, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .preview-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-modal iframe {
            flex: 1;
            border: none;
            background: white;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .icon-wrapper {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.4s ease;
        }

        .icon-wrapper:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .editor-container {
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }

        .editor-container:focus-within {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15), 0 4px 16px rgba(14, 165, 233, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .editor-textarea {
            background: transparent;
            border: none;
            padding: 16px;
            padding-left: 58px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #1e293b;
            resize: none;
            width: 100%;
            min-height: 450px;
            line-height: 1.6;
        }

        .editor-textarea:focus {
            outline: none;
        }

        .editor-textarea::placeholder {
            color: #94a3b8;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(14, 165, 233, 0.03);
            border-bottom: 1px solid rgba(14, 165, 233, 0.1);
        }

        .editor-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .editor-title i {
            color: #0ea5e9;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50px;
            background: rgba(14, 165, 233, 0.03);
            border-right: 1px solid rgba(14, 165, 233, 0.1);
            padding: 16px 8px;
            text-align: right;
            color: #94a3b8;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            user-select: none;
            overflow: hidden;
        }
    </style>
</head>
<body class="grid-pattern">
    <div class="hero-blob w-[300px] h-[300px] bg-brand-400/30 top-0 right-0"></div>
    <div class="hero-blob w-[200px] h-[200px] bg-accent-purple/30 bottom-0 left-0" style="animation-delay: -3s;"></div>

    <div class="min-h-screen py-8 px-4 md:px-6 relative">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 mb-4">
                    <div class="icon-wrapper bg-gradient-to-br from-brand-500 to-accent-purple text-white">
                        <i class="fas fa-code"></i>
                    </div>
                    <h1 class="font-display text-3xl md:text-4xl font-bold gradient-text">HTML在线预览</h1>
                </div>
                <p class="text-gray-500 text-base">实时预览HTML代码效果，支持全屏查看</p>
            </div>

            <div class="card p-4 md:p-6">
                <div class="editor-container">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fas fa-code"></i>
                            <span>HTML代码编辑器</span>
                        </div>
                        <button id="previewBtn" class="btn-primary">
                            <i class="fas fa-eye mr-2"></i>全屏预览
                        </button>
                    </div>
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <textarea 
                        id="htmlCode" 
                        class="editor-textarea"
                        placeholder="<!-- 在这里粘贴您的HTML代码 -->

<div style='text-align: center; padding: 50px;'>
    <h1 style='color: #0ea5e9;'>Hello World</h1>
    <p>这是一个示例页面</p>
    <button style='margin-top: 20px; padding: 10px 30px; background: linear-gradient(135deg, #0ea5e9, #8b5cf6); color: white; border: none; border-radius: 10px; cursor: pointer;' onclick='alert(\"交互成功！\")'>点击测试</button>
</div>"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="previewModal" class="preview-modal">
        <button id="closeBtn" class="close-btn">
            <i class="fas fa-times"></i>
        </button>
        <iframe id="previewIframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>

    <script>
        const htmlCode = document.getElementById('htmlCode');
        const previewBtn = document.getElementById('previewBtn');
        const previewModal = document.getElementById('previewModal');
        const closeBtn = document.getElementById('closeBtn');
        const previewIframe = document.getElementById('previewIframe');
        const lineNumbers = document.getElementById('lineNumbers');

        function updateLineNumbers() {
            const lines = htmlCode.value.split('\n').length;
            let numbersHtml = '';
            for (let i = 1; i <= lines; i++) {
                numbersHtml += i + '\n';
            }
            lineNumbers.textContent = numbersHtml;
        }

        htmlCode.addEventListener('input', updateLineNumbers);
        htmlCode.addEventListener('scroll', () => {
            lineNumbers.scrollTop = htmlCode.scrollTop;
        });

        updateLineNumbers();

        previewBtn.addEventListener('click', () => {
            const code = htmlCode.value.trim();
            
            if (!code) {
                alert('请输入HTML代码后再进行预览');
                return;
            }
            
            const fullHtml = `
                <!DOCTYPE html>
                <html lang="zh-CN">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>预览效果</title>
                    <base target="_blank">
                </head>
                <body>
                    ${code}
                </body>
                </html>
            `;
            
            previewIframe.srcdoc = fullHtml;
            previewModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        closeBtn.addEventListener('click', () => {
            previewModal.classList.remove('active');
            document.body.style.overflow = '';
            previewIframe.srcdoc = '';
        });

        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                closeBtn.click();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && previewModal.classList.contains('active')) {
                closeBtn.click();
            }
        });
    </script>
</body>
</html>
