<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛事报名｜Flyz远征飞</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #0096FF;
      --dark: #0066CC;
      --light: #66CCFF;
      --radius: 18px;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #000814;
      background-image: 
        linear-gradient(rgba(0,150,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,150,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      padding: 30px 0;
      color: #fff;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 40px;
    }
    .logo img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      box-shadow: 0 0 20px var(--blue);
    }
    .logo .text {
      margin-left: 12px;
    }
    .logo .domain {
      font-size: 1.3rem;
      color: var(--light);
      font-weight: bold;
    }
    .logo .slogan {
      font-size: 0.9rem;
      color: #88bfff;
    }

    /* 标题 */
    .title {
      text-align: center;
      margin-bottom: 45px;
      line-height: 1.3;
    }
    .title .line1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, #00ccff, #0077ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title .line2 {
      font-size: 1.5rem;
      margin-top: 8px;
      color: #b3d9ff;
    }

    /* 按钮 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      padding: 16px;
      background: linear-gradient(90deg, rgba(0,102,204,0.8), rgba(0,150,255,0.8));
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1.3rem;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,150,255,0.25);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,150,255,0.4);
    }

    /* 扫光动画 */
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      transition: left 0.8s ease;
    }

    .btn:hover::before {
      left: 130%;
    }

    /* 选手按钮高亮 */
    .btn-player {
      background: linear-gradient(90deg, #0077FF, #00CCFF);
      font-size: 1.45rem;
      box-shadow: 0 8px 20px rgba(0,150,255,0.4);
    }

    /* 弹窗 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,8,20,0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal .content {
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      color: #333;
      text-align: center;
    }

    .modal h3 {
      color: var(--dark);
      margin-bottom: 16px;
      font-size: 1.45rem;
    }

    .modal p {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .link-box {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border: 2px solid var(--blue);
      border-radius: 12px;
      background: #f0f7ff;
    }

    .link-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: #333;
      outline: none;
    }

    .link-box button {
      padding: 8px 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .wechat {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--dark);
      margin: 10px 0;
    }

    .close {
      padding: 10px 26px;
      background: #f0f0f0;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .close:hover {
      background: #e6e6e6;
    }

    /* 页脚 */
    footer {
      text-align: center;
      margin-top: 70px;
      color: #88bfff;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="https://img520.com/UIGuUV.jpeg" alt="Flyz远征飞">
      <div class="text">
        <div class="domain">917813.com.cn</div>
        <div class="slogan">Flyz远征飞｜为方便模友而生</div>
      </div>
    </div>

    <!-- 标题 -->
    <div class="title">
      <div class="line1">FlyZ 远征飞</div>
      <div class="line2">2026 全国线上 FPV 赛事报名</div>
    </div>

    <!-- 按钮 -->
    <div class="btn-group">
      <button class="btn btn-player" id="player">选手报名</button>
      <button class="btn" id="sponsor">赞助商报名</button>
      <button class="btn" id="logistics">后勤组报名</button>
    </div>
  </div>

  <!-- 选手弹窗 -->
  <div class="modal" id="playerModal">
    <div class="content">
      <h3>选手报名流程</h3>
      <p>1. 复制下方问卷链接到浏览器打开并填写</p>

      <div class="link-box">
        <input type="text" value="https://www.wjx.top/vm/QvVrAbf.aspx" readonly>
        <button onclick="copyLink()">复制</button>
      </div>

      <p>2. 添加微信，发送【选手报名】进群</p>
      <div class="wechat">YGWFK2024</div>

      <button class="close" onclick="closeModal('playerModal')">关闭</button>
    </div>
  </div>

  <!-- 赞助商弹窗 -->
  <div class="modal" id="sponsorModal">
    <div class="content">
      <h3>赞助商报名</h3>
      <p>添加微信，发送【赞助商报名】</p>
      <div class="wechat">YGWFK2024</div>
      <button class="close" onclick="closeModal('sponsorModal')">关闭</button>
    </div>
  </div>

  <!-- 后勤弹窗 -->
  <div class="modal" id="logisticsModal">
    <div class="content">
      <h3>后勤组报名</h3>
      <p>添加微信，发送【后勤组报名】</p>
      <div class="wechat">YGWFK2024</div>
      <button class="close" onclick="closeModal('logisticsModal')">关闭</button>
    </div>
  </div>

  <footer>
    天津魄客创新（科技）有限公司 · PokRC 团队
  </footer>

  <script>
    // 打开弹窗
    $('#player').click(() => $('#playerModal').addClass('show'));
    $('#sponsor').click(() => $('#sponsorModal').addClass('show'));
    $('#logistics').click(() => $('#logisticsModal').addClass('show'));

    // 关闭弹窗
    function closeModal(id) {
      $('#' + id).removeClass('show');
    }

    // 复制链接
    function copyLink() {
      const input = document.querySelector('.link-box input');
      input.select();
      document.execCommand('copy');
      alert('链接已复制！');
    }
  </script>
</body>
</html>
