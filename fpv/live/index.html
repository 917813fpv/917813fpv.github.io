        // 数据源 - 测试超长文本
        const TEST_DATA = {

        };
        const REMOTE_URL = {
            RANK: "https://cdn.917813.com.cn/fpv/2026onlinerace/live/xs.txt",
            GIFT: "https://cdn.917813.com.cn/fpv/2026onlinerace/live/chou.txt",
            AD: "https://cdn.917813.com.cn/fpv/2026onlinerace/live/gg.txt"
        };

        // ======================
        // 新增：开屏动画逻辑
        // ======================
        const splash = document.getElementById('splash');
        const fakeNavbar = document.getElementById('fake-navbar');
        // 开屏动画显示2秒后淡出
        setTimeout(() => {
            splash.style.opacity = 0;
            setTimeout(() => {
                splash.style.display = 'none';
                // 显示假导航栏
                fakeNavbar.style.opacity = 1;
            }, 500);
        }, 2000);

        // ======================
        // 强化粒子系统 - 增大数量、速度、动态效果
        // ======================
        const particleInstances = {};
        class ParticleSystem {
            constructor(canvasId, isGlobal = false) {
                if (particleInstances[canvasId]) return particleInstances[canvasId];
                
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                // 大幅增加粒子数量
                this.particleCount = isGlobal ? 150 : 50;
                this.colors = ['#00b7ff', '#4169e1', '#8a2be2', '#00ced1', '#1e90ff', '#ff1493', '#32cd32'];
                this.isGlobal = isGlobal;
                this.animationId = null;
                
                particleInstances[canvasId] = this;
                this.resize();
                this.initParticles();
                this.animate();
                
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    // 增大粒子尺寸、提高速度、增加透明度变化
                    const baseSize = this.isGlobal ? (Math.random() * 5 + 1) : (Math.random() * 3 + 0.8);
                    const baseSpeed = this.isGlobal ? (Math.random() - 0.5) * 1.2 : (Math.random() - 0.5) * 0.6;
                    
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: baseSize,
                        speedX: baseSpeed,
                        speedY: baseSpeed,
                        opacity: this.isGlobal ? (Math.random() * 0.3 + 0.1) : (Math.random() * 0.25 + 0.1),
                        opacitySpeed: (Math.random() - 0.5) * 0.005, // 透明度动态变化
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        // 粒子轨迹拖尾效果
                        trailLength: Math.floor(Math.random() * 3 + 1)
                    });
                }
            }

            drawParticles() {
                // 半透明清屏，实现拖尾效果
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(particle => {
                    // 透明度动态呼吸
                    particle.opacity += particle.opacitySpeed;
                    if (particle.opacity > 0.4) particle.opacitySpeed *= -1;
                    if (particle.opacity < 0.05) particle.opacitySpeed *= -1;
                    
                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `${particle.color}${Math.floor(particle.opacity * 255).toString(16).padStart(2, '0')}`;
                    this.ctx.fill();
                    
                    // 绘制轨迹
                    if (particle.trailLength > 1) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(particle.x, particle.y);
                        this.ctx.lineTo(
                            particle.x - particle.speedX * 5,
                            particle.y - particle.speedY * 5
                        );
                        this.ctx.strokeStyle = `${particle.color}${Math.floor((particle.opacity * 0.5) * 255).toString(16).padStart(2, '0')}`;
                        this.ctx.lineWidth = particle.size * 0.3;
                        this.ctx.stroke();
                    }
                });
            }

            updateParticles() {
                this.particles.forEach(particle => {
                    // 粒子移动
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    
                    // 边界反弹（替代循环，更动态）
                    if (particle.x < 0 || particle.x > this.canvas.width) {
                        particle.speedX *= -1;
                        particle.x = Math.max(0, Math.min(this.canvas.width, particle.x));
                    }
                    if (particle.y < 0 || particle.y > this.canvas.height) {
                        particle.speedY *= -1;
                        particle.y = Math.max(0, Math.min(this.canvas.height, particle.y));
                    }
                    
                    // 随机变向
                    if (Math.random() < 0.005) {
                        particle.speedX = (Math.random() - 0.5) * (this.isGlobal ? 1.2 : 0.6);
                        particle.speedY = (Math.random() - 0.5) * (this.isGlobal ? 1.2 : 0.6);
                    }
                });
            }

            animate() {
                if (this.animationId) cancelAnimationFrame(this.animationId);
                this.drawParticles();
                this.updateParticles();
                this.animationId = requestAnimationFrame(() => this.animate());
            }
        }

        // ======================
        // 全新广告滚动逻辑 - 原生JS实现，适配超长文本
        // ======================
        let adAnimationId = null;
        function initAdScroll(adContent) {
            const adEl = document.getElementById('adContent');
            const containerEl = adEl.parentElement;
            if (!adEl || !containerEl) return;

            // 停止现有动画
            if (adAnimationId) {
                cancelAnimationFrame(adAnimationId);
                adAnimationId = null;
            }

            // 设置文本内容
            adEl.textContent = adContent;
            
            // 等待DOM渲染完成
            setTimeout(() => {
                const adWidth = adEl.offsetWidth;
                const containerWidth = containerEl.offsetWidth;
                
                // 如果文字宽度小于容器宽度，不滚动
                if (adWidth <= containerWidth) {
                    adEl.style.transform = 'translateX(0)';
                    return;
                }

                // 滚动配置
                const speed = 60; // 像素/秒
                let position = containerWidth; // 初始位置（容器右侧外）
                const maxPosition = -adWidth; // 最终位置（文字完全滚出左侧）
                
                // 动画函数
                function animateScroll(timestamp) {
                    // 计算每帧移动距离
                    const moveDistance = speed / 60; // 60fps
                    position -= moveDistance;
                    
                    // 重置位置
                    if (position <= maxPosition) {
                        position = containerWidth;
                    }
                    
                    // 应用位移
                    adEl.style.transform = `translateX(${position}px)`;
                    
                    // 继续动画
                    adAnimationId = requestAnimationFrame(animateScroll);
                }
                
                // 启动动画
                adAnimationId = requestAnimationFrame(animateScroll);
            }, 100);
        }

        // 数据加载
        async function getData(type) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 3000);
                const res = await fetch(REMOTE_URL[type], { signal: controller.signal, cache: 'no-store' });
                clearTimeout(timeout);
                if (!res.ok) throw new Error('接口异常');
                const data = await res.text();
                return data.trim() || TEST_DATA[type];
            } catch (e) {
                return TEST_DATA[type];
            }
        }

        // 更新排名
        async function updateRank() {
            const data = await getData('RANK');
            const listEl = document.getElementById('rankList');
            listEl.innerHTML = '';
            
            const rankItems = data.split('\n').filter(l => l.trim());
            
            if (rankItems.length === 0) {
                listEl.innerHTML = `<li class="rank-item"><span class="rank-num">-</span><span class="rank-name">暂无排名数据</span><span class="rank-score">--:--.--</span></li>`;
                return;
            }
            
            rankItems.forEach((line, idx) => {
                const [name, time] = line.split('=');
                const item = document.createElement('li');
                item.className = 'rank-item';
                item.innerHTML = `
                    <span class="rank-num">${idx+1}</span>
                    <span class="rank-name">${name||'未知选手'}</span>
                    <span class="rank-score">${time||'--:--.--'}</span>
                `;
                listEl.appendChild(item);
            });
        }

        // 更新抽奖信息
        async function updateGift() {
            const data = await getData('GIFT');
            document.getElementById('giftContent').textContent = `即将抽出：${data}`;
        }

        // 初始化
        window.addEventListener('load', async () => {
            // 初始化强化版粒子系统
            new ParticleSystem('canvas-bg', true);
            new ParticleSystem('banner-particles');
            new ParticleSystem('video-particles');
            new ParticleSystem('ad-particles');
            new ParticleSystem('gift-particles');
            new ParticleSystem('small-video-particles');
            new ParticleSystem('rank-particles');
            
            // 加载数据
            await updateRank();
            await updateGift();
            initAdScroll(await getData('AD'));
            
            // 定时刷新
            setInterval(async () => {
                await updateRank();
                await updateGift();
                initAdScroll(await getData('AD'));
            }, 15000);
            
            // 入场动画
            gsap.from('.big-card', { opacity: 0, scale: 0.98, duration: 1.0, ease: 'easeOut', delay: 0.5 });
            const components = document.querySelectorAll('.card-base');
            components.forEach((el, idx) => {
                gsap.from(el, { opacity: 0, y: 10, duration: 0.5, delay: 0.6 + idx * 0.08, ease: 'power3.out' });
            });
        });
    </script>
</body>
